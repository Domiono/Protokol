plugins { id 'com.android.application' }
// Firebase config is added securely during CI; old installations keep working without it.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('RentMor: FIREBASE_ANDROID_CONFIG missing; periodic notification fallback remains active.')
}

android {
    namespace 'pl.rentmor.protokol'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.rentmor.protokol'
        minSdk 29
        targetSdk 35
        versionCode 28
        versionName '1.7.13'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RENTMOR_KEYSTORE_PATH') ?: 'rentmor-release.jks')
            storePassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RENTMOR_KEY_ALIAS')
            keyPassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { exceptionFormat = 'full'; events 'failed', 'passed' } }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
