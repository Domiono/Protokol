plugins { id 'com.android.application' }

android {
    namespace 'pl.rentmor.protokol'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.rentmor.protokol'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RENTMOR_KEYSTORE_PATH') ?: 'rentmor-release.jks')
            storePassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RENTMOR_KEY_ALIAS')
            keyPassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
