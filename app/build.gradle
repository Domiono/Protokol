plugins { id 'com.android.application' }

android {
    namespace 'pl.rentmor.protokol'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.rentmor.protokol'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RENTMOR_KEYSTORE_PATH') ?: 'rentmor-release.jks')
            storePassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RENTMOR_KEY_ALIAS')
            keyPassword System.getenv('RENTMOR_KEYSTORE_PASSWORD')
        }
    }

    testOptions { unitTests.includeAndroidResources = true }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13.2'
}
