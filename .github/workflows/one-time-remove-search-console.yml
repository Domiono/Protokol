name: Finalize Search Console removal and synchronize notes
on:
  push:
    branches: [codex/remove-search-console-publish-20261110]
    paths: [.github/workflows/one-time-remove-search-console.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-remove-search-console
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: php -l deployment/remove-search-console/remote.php && python3 scripts/test_remove_search_console.py
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Disable remaining connection and synchronize only private notes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/remove-search-console/publish.py --progress-only --disable-connection
