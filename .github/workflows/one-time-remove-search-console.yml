name: Validate sign and publish removal of Search Console
on:
  push:
    branches: [codex/remove-search-console-publish-20261110]
    paths: [.github/workflows/one-time-remove-search-console.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-remove-search-console
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scoped removal and old endpoint
        run: |
          php -l server/admin.php
          php -l server/protocol_sync.php
          php -l deployment/remove-search-console/remote.php
          python3 scripts/test_remove_search_console.py
          python3 scripts/test_retired_console_endpoint.py
          python3 deployment/apk-download/test_endpoint.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_JSON: ${{ secrets.RENTMOR_FIREBASE_ANDROID_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rentmor-release.jks"
          if [ -n "$FIREBASE_ANDROID_JSON" ]; then printf '%s' "$FIREBASE_ANDROID_JSON" > app/google-services.json; fi
      - name: Complete Android tests and sign version 1.7.31
        env:
          RENTMOR_KEYSTORE_PATH: ${{ runner.temp }}/rentmor-release.jks
          RENTMOR_KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          RENTMOR_KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Remove integration and publish same-signer update
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/remove-search-console/publish.py
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rentmor-release.jks" app/google-services.json
