name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub secret RENTMOR_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub secret RENTMOR_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub secret RENTMOR_KEY_ALIAS" && exit 1)
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rentmor-release.jks"
      - name: Build signed release APK
        env:
          RENTMOR_KEYSTORE_PATH: ${{ runner.temp }}/rentmor-release.jks
          RENTMOR_KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          RENTMOR_KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: protokol-rentmor-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare installer filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/RentMor.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RentMor – najnowsza aplikacja
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: app/build/outputs/apk/release/RentMor.apk
