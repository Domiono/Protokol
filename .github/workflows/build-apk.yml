name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: protokol-rentmor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare installer filename
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RentMor.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RentMor – najnowsza aplikacja
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/RentMor.apk
