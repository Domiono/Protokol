name: Test and publish per-equipment AI knowledge
on:
  push:
    branches: [codex/equipment-ai-knowledge-20261110]
    paths: [.github/workflows/equipment-knowledge.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Parse and test knowledge isolation with fixtures
        run: |
          php -l server/ai_equipment_knowledge.php
          php -l server/ai_knowledge_store.php
          php -l server/ai_app_knowledge.php
          php -l server/mortii_api.php
          php scripts/test_ai_app_knowledge.php
          php scripts/test_ai_equipment_knowledge.php
          python3 deployment/apk-download/test_endpoint.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_JSON: ${{ secrets.RENTMOR_FIREBASE_ANDROID_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rentmor-release.jks"
          if [ -n "$FIREBASE_ANDROID_JSON" ]; then printf '%s' "$FIREBASE_ANDROID_JSON" > app/google-services.json; fi
      - name: Editor and download tests and signed release
        env:
          RENTMOR_KEYSTORE_PATH: ${{ runner.temp }}/rentmor-release.jks
          RENTMOR_KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          RENTMOR_KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest --tests '*.AiEquipmentKnowledgeTest' --tests '*.AiKnowledgePageTest' --tests '*.ApkDownloadsTest' --tests '*.SyncManagerHttpTest' --tests '*.NotebookPageTest' --tests '*.HomeInboxShortcutTest' assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: rentmor-1.7.29-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1
      - run: python3 -m pip install 'paramiko==3.5.1' --quiet
      - name: Publish exact source versions and signed release
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/equipment-knowledge/publish.py
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rentmor-release.jks" app/google-services.json
