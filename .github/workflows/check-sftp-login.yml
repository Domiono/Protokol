name: Check RentMor SFTP Login
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/check-sftp-login.yml'
  workflow_dispatch:

jobs:
  read-only-login-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      - name: Validate saved host key and test existing FTP credentials over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          : "${FTP_SERVER:?Missing configured server}"
          : "${FTP_USERNAME:?Missing configured login}"
          : "${LFTP_PASSWORD:?Missing configured password}"
          HOSTKEYS="$RUNNER_TEMP/rentmor_known_hosts"
          ssh-keyscan -p 22222 -T 10 -t ed25519 "$FTP_SERVER" 2>/dev/null > "$HOSTKEYS"
          test -s "$HOSTKEYS"
          FINGERPRINT="$(ssh-keygen -lf "$HOSTKEYS" -E sha256)"
          printf '%s\n' "$FINGERPRINT" | grep -Fq 'SHA256:nJyQovQRMmJEJuzI44hZS/VhZPrOhzRoEyh92Go6TEk' || {
            echo "Host key changed since the prior probe. Refusing to send a password."
            exit 1
          }
          chmod 600 "$HOSTKEYS"
          echo "SFTP host key matches the previously observed fingerprint."
          # lftp takes the password from the environment, not command-line arguments.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "set cmd:fail-exit yes; set net:timeout 18; set net:max-retries 1; set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOSTKEYS\"; pwd; cls -1 public_html/index.php; bye" >/dev/null
          echo "Read-only SFTP authentication succeeded; public_html/index.php is accessible."
