name: Audit Live RentMor Sitemap and Layout
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/audit-live-site.yml'
      - 'scripts/audit_live_site.py'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      - name: Read live website sources (no modifications)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          source scripts/secure_sftp_connection.sh
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TMP_DIR/index.php; bye"
          python3 - "$TMP_DIR/index.php" <<'PY'
          import re, sys
          lines=open(sys.argv[1]).read().splitlines()
          selected=set()
          for i,line in enumerate(lines):
              if re.search(r"stats|total_views|unique_visitors|visitor_id",line,re.I):
                  selected.update(range(max(0,i-8),min(len(lines),i+16)))
          for i in sorted(selected):
              if not re.search(r"token|password|secret|chat_id|hasz_hasla|telegram",lines[i],re.I):
                  print(f"{i+1}: {lines[i]}")
          PY
