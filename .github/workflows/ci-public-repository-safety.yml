name: Enforce public GitHub test-only policy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    name: No hosting secrets or deploy workflows
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject SFTP, production deploy, secret paths and write scopes
        run: python3 scripts/assert_github_test_only.py
