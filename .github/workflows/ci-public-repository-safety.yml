name: Check public repository deployment safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    name: Protect secrets and deployment triggers
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public repository safety
        run: python3 scripts/assert_github_test_only.py
