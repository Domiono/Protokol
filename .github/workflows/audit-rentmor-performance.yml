name: Audit public RentMor performance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_public_image_markup.py'
      - '.github/workflows/audit-rentmor-performance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_public_assets.py'
      - 'scripts/check_public_image_markup.py'
      - '.github/workflows/audit-rentmor-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory public home and offer image markup
        run: python3 scripts/audit_public_assets.py
      - name: Check image srcset, dimensions and full-size originals in live HTML
        run: python3 scripts/check_public_image_markup.py
