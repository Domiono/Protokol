name: Register owner-confirmed single Bosch copy
on:
  push:
    branches: [codex/mortii-copy-deployment-preparation]
    paths: [.github/workflows/register-bosch-once.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: php -l deployment/bosch-copy/register.php
      - run: python3 -m pip install 'paramiko==3.5.1'
      - name: Register one copy under native locks with private backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/bosch-copy/register.py
