name: Validate admin AI knowledge and signed Android
on:
  push:
    branches: [codex/admin-ai-knowledge-20261110]
    paths: [.github/workflows/knowledge-validate.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: PHP parser and synthetic knowledge tests
        run: |
          php -l server/ai_app_knowledge.php
          php -l server/protocol_sync.php
          php -l server/mortii_api.php
          php -l server/ai_chat_service.php
          php scripts/test_ai_app_knowledge.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare existing release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_JSON: ${{ secrets.RENTMOR_FIREBASE_ANDROID_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rentmor-release.jks"
          if [ -n "$FIREBASE_ANDROID_JSON" ]; then printf '%s' "$FIREBASE_ANDROID_JSON" > app/google-services.json; fi
      - name: Android editor, API, and regression tests plus release
        env:
          RENTMOR_KEYSTORE_PATH: ${{ runner.temp }}/rentmor-release.jks
          RENTMOR_KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          RENTMOR_KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest --tests '*.AiKnowledgePageTest' --tests '*.SyncManagerHttpTest' --tests '*.NotebookPageTest' --tests '*.HomeInboxShortcutTest' assembleRelease
      - name: Verify release signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-knowledge-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3
      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rentmor-release.jks" app/google-services.json
