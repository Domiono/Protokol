name: Authorized AI knowledge source capture
on:
  push:
    branches: [codex/admin-ai-knowledge-20261110]
    paths: [.github/workflows/knowledge-source-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python3 -m pip install 'paramiko==3.5.1' cryptography --quiet
      - name: Read only selected source and encrypt to session key
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import os,stat,hashlib,base64,io,zipfile,json,logging
          import paramiko
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          logging.getLogger('paramiko').addHandler(logging.NullHandler())
          logging.getLogger('paramiko').propagate=False
          t=paramiko.Transport((os.environ['FTP_SERVER'],22222))
          try:
           t.start_client(timeout=25)
           fp=base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
           assert fp in {'nJyQovQRMmJEJuzI44hZS/VhZPrOhzRoEyh92Go6TEk','GDfRh92pfMOviF06fYXQSIHQ0OSKwDNOXqzr+Tslrr0'},'Host key'
           t.auth_password(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'],fallback=False)
           s=paramiko.SFTPClient.from_transport(t);s.get_channel().settimeout(30)
           files=['ai_chat.php','ai_chat_service.php','ai_booking_store.php']
           files += sorted(n for n in s.listdir('public_html') if n.startswith('mortii') and n.endswith('.php') and '/' not in n)
           buf=io.BytesIO()
           with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
            for name in files:
             path='public_html/'+name;meta=s.lstat(path)
             assert stat.S_ISREG(meta.st_mode) and meta.st_size<2000000
             with s.open(path,'rb') as f:data=f.read(2000001)
             z.writestr('source/'+name,data)
            for name in ['CONTINUE-RENTMOR.md','RENTMOR-PROJECT-LOG.md']:
             path='rentmor-control-private/progress/'+name
             try:
              meta=s.lstat(path);assert stat.S_ISREG(meta.st_mode) and not meta.st_mode&0o077 and meta.st_size<1000000
              with s.open(path,'rb') as f:data=f.read(1000001)
              z.writestr('progress/'+name,data)
             except FileNotFoundError:pass
           key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
           pub=serialization.load_pem_public_key("-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw9jC2M2UNS+OAsaMywiW\ni1AWFgHkg8X0sefrag7lBWwQVgfpUvQvU6/33MM+lZD9qkV9zoKoMPSsU3iimm5s\nIHB+f40a63JG285DbnZVeN/SxarQBCz0sDxgY/STfFpDLN6fzToJZEukk72vGuZj\n6rdsuHk2rJD7EG7/FLSO79u8ebjf20hSBXcAO2s2bMeLd+kTtkeSlcDM2GAee6Q9\nCPTMM2ahuOegSXbYCLhDHq2V89uvaeISrkBtHqCxDGLMiv+Y5NjL6mYH0aiUUPIS\neiunRyBfDxz1O++WnOFKUpQqgXwG9UH60ubcr8Acgy7SOvI0QLd+1Lnhb6ISKeQD\n9ROO5LeZeywTSubzSqg/JiGWHCgUKWONci5EsdUV3eo/WpFeQEaWaWL8DdD2qDUW\npjLFOBmw7Hq9nVKhKH+NuhO8TauGbgB6gFj4yoX1A3w5co3aASf4aauLduhC042/\nOXyfnrP05jydxUadC/vHqjP4Oxv75cIGgAxPqzTF0jAZAgMBAAE=\n-----END PUBLIC KEY-----\n".encode())
           sealed=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
           out={'key':base64.b64encode(sealed).decode(),'nonce':base64.b64encode(nonce).decode(),'data':base64.b64encode(AESGCM(key).encrypt(nonce,buf.getvalue(),None)).decode()}
           open('source-encrypted.json','w').write(json.dumps(out))
           print('ENCRYPTED_SOURCE_CAPTURE_OK',len(files))
          finally:t.close()
          
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-source-encrypted
          path: source-encrypted.json
          retention-days: 1
