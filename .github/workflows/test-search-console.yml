name: Test Search Console panel
on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/search-console-admin-20261110']
permissions:
  contents: read
jobs:
  search-console:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/assert_github_test_only.py
      - run: php -l server/search_console.php && php -l server/search_console_admin.php && php -l server/admin.php
      - run: php scripts/test_search_console.php
      - run: python3 scripts/test_search_console_patch.py
      - run: python3 scripts/test_search_console_http.py
