name: One-time catalogue SEO publication
on:
  push:
    branches: [codex/publish-catalogue-20261111]
    paths: [.github/workflows/one-time-catalogue-seo.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: php -l server/category.php && python3 -m py_compile deployment/catalogue-seo/publish.py
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Publish exact catalogue patch and synchronize private notes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/catalogue-seo/publish.py
