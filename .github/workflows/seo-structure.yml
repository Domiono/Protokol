name: RentMor SEO categories and rental structure
on:
  pull_request:
    paths: ['server/seo_structure.php', 'server/rentmor_accessibility.php', 'server/rental_categories.php', 'server/category.php', 'server/category_sitemap.php', 'server/seo-structure.css', 'scripts/*seo_structure*', 'scripts/test_shared_header.php', 'scripts/audit_wcag_live.py', 'scripts/test_wcag_accessibility.php', '.github/workflows/seo-structure.yml']
  push:
    branches: [main]
    paths: ['server/seo_structure.php', 'server/rentmor_accessibility.php', 'server/rental_categories.php', 'server/category.php', 'server/category_sitemap.php', 'server/seo-structure.css', 'scripts/*seo_structure*', 'scripts/audit_wcag_live.py', 'scripts/test_wcag_accessibility.php', '.github/workflows/seo-structure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test structure and semantics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp webp
          for file in server/{rental_categories,category,category_sitemap,rentmor_accessibility,seo_structure}.php; do php -l "$file"; done
          mkdir -p reports
          cwebp -quiet -q 68 -m 6 -resize 1200 0 server/assets/rentmor-blueprint-final-20261030.webp -o reports/rentmor-blueprint-mobile-20261103.webp
          test "$(stat -c%s reports/rentmor-blueprint-mobile-20261103.webp)" -lt 145000
          # Same approved artwork; smaller size at phone resolutions reduces contention on mobile.
          cwebp -quiet -q 48 -m 6 -resize 1200 0 server/assets/rentmor-blueprint-final-20261030.webp -o reports/rentmor-blueprint-mobile-20261103-lite.webp
          test "$(stat -c%s reports/rentmor-blueprint-mobile-20261103-lite.webp)" -lt 115000
          python3 scripts/test_seo_structure.py
          php scripts/test_seo_structure.php
          php scripts/test_shared_header.php
          php scripts/test_wcag_accessibility.php
          php scripts/test_related_offers.php
          bash -n scripts/publish_seo_structure.sh
          python3 scripts/test_seo_structure_http.py
          python3 scripts/audit_wcag_live.py
          npm install --no-save playwright@1.56.1 lighthouse@12.8.2
          node scripts/seo_structure_browser.cjs
          RM_ASSETS_PREVIEW=1 node scripts/seo_structure_assets_browser.cjs
      - name: Capture before-release mobile performance
        if: github.event_name != 'pull_request'
        run: |
          for N in 1 2 3; do
            npx lighthouse https://rentmor.pl/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --output=json --output-path="reports/mobile-before-$N.json" --quiet
            python3 scripts/summarize_speed.py "reports/mobile-before-$N.json" | grep '^SPEED_RESULT'
            npx lighthouse https://rentmor.pl/odkurzacz-pioracy-karcher-puzzi-10-1/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --output=json --output-path="reports/offer-before-$N.json" --quiet
            python3 scripts/summarize_speed.py "reports/offer-before-$N.json" | grep '^SPEED_RESULT'
          done
      - name: Publish with backup, readback and rollback
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/publish_seo_structure.sh
      - name: Capture after-release mobile performance
        if: github.event_name != 'pull_request'
        run: |
          for N in 1 2 3; do
            npx lighthouse https://rentmor.pl/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --output=json --output-path="reports/mobile-after-$N.json" --quiet
            python3 scripts/summarize_speed.py "reports/mobile-after-$N.json" | grep '^SPEED_RESULT'
            npx lighthouse https://rentmor.pl/odkurzacz-pioracy-karcher-puzzi-10-1/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --output=json --output-path="reports/offer-after-$N.json" --quiet
            python3 scripts/summarize_speed.py "reports/offer-after-$N.json" | grep '^SPEED_RESULT'
          done
          python3 - <<'PY'
          import json,statistics
          for prefix in ('mobile','offer'):
              for phase in ('before','after'):
                  sources=[json.load(open(f'reports/{prefix}-{phase}-{i}.json')) for i in (1,2,3)]
                  values=[source['audits']['largest-contentful-paint']['numericValue'] for source in sources]
                  scores=[source['categories']['performance']['score'] for source in sources]
                  print(prefix.upper()+'_LCP_MEDIAN', phase, round(statistics.median(values)), 'ms', list(map(round,values)), 'perf_med', round(statistics.median(scores)*100))
                  for metric in ('total-blocking-time','cumulative-layout-shift','total-byte-weight'):
                      samples=[source['audits'][metric]['numericValue'] for source in sources]
                      print(prefix.upper(), phase, metric, statistics.median(samples))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-menu-evidence
          path: reports/
