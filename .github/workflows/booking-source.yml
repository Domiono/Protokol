name: Read multi equipment source baseline
on:
  push:
    branches: [codex/multi-equipment-reservations-20261116]
    paths: [.github/workflows/booking-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install paramiko==3.5.1 cryptography --quiet
      - name: Read only approved sources and private progress
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/multi-equipment/read_source.py
