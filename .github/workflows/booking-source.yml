name: Check current offer editor hosting baseline
on:
  push:
    branches: [codex/full-offer-editor-20261113]
    paths: [.github/workflows/booking-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Read only source hashes and file presence
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/offer-editor/preflight.py
