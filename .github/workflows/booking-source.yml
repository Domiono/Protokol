name: Record notebook publication
on:
  push:
    branches: [release/notebook-54-progress]
    paths: [.github/workflows/booking-source.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install paramiko==3.5.1 --quiet
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/notebook/sync_final.py
