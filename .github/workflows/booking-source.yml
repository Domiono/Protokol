name: Read approved page statistics sources
on:
  push:
    branches: [codex/page-statistics-20261117]
    paths: [.github/workflows/booking-source.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install paramiko==3.5.1 --quiet
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/page-statistics/read_source.py
