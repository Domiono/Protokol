name: Publish retry-safe RentMor Control OAuth fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mcp-oauth-retry.yml'
      - 'scripts/patch_mcp_oauth_retry.py'
      - 'scripts/test_mcp_oauth_retry.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentmor-control-oauth-retry-deploy
  cancel-in-progress: false

jobs:
  patch-and-publish:
    if: github.repository == 'Domiono/Protokol'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp
      - name: Verify live source, test offline, back up and publish only oauth.php
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing SFTP host}"
          : "${FTP_USERNAME:?Missing SFTP user}"
          : "${LFTP_PASSWORD:?Missing SFTP password}"
          source scripts/secure_sftp_connection.sh
          umask 077
          DIR="$(mktemp -d "$RUNNER_TEMP/rentmor-oauth-atomic.XXXXXX")"
          LIVE="public_html/rentmor-control-mcp/oauth.php"
          CORE="public_html/rentmor-control-mcp/oauth_core.php"
          BACKUP="rentmor-control-private/oauth-backup-before-retry-$GITHUB_RUN_ID.php"
          STAGE="rentmor-control-private/oauth-staged-retry-$GITHUB_RUN_ID.php"
          SWITCH_ATTEMPTED=0
          VERIFIED=0
          cleanup() {
            RC=$?
            if [ "$SWITCH_ATTEMPTED" = "1" ] && [ "$VERIFIED" != "1" ]; then
              echo "::warning::OAuth deployment did not pass verification. Restoring previous OAuth PHP."
              if lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/original.php -o $LIVE; get $LIVE -o $DIR/rollback-check.php; bye" >/dev/null &&
                 cmp -s "$DIR/original.php" "$DIR/rollback-check.php"; then
                echo "Previous OAuth PHP restored and verified."
              else
                echo "::error::Automatic OAuth restore not confirmed. Verified backup is at $BACKUP."
              fi
            fi
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm $STAGE; bye" >/dev/null 2>&1 || true
            rm -rf "$DIR"
            exit "$RC"
          }
          trap cleanup EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $LIVE -o $DIR/original.php; get $CORE -o $DIR/oauth_core.php; bye" >/dev/null
          python3 scripts/patch_mcp_oauth_retry.py "$DIR/original.php" "$DIR/patched.php"
          php -l "$DIR/original.php"
          php -l "$DIR/oauth_core.php"
          php -l "$DIR/patched.php"
          python3 scripts/test_mcp_oauth_retry.py "$DIR/patched.php" "$DIR/oauth_core.php"
          # Refuse to deploy if the live file changed since it was checked.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $LIVE -o $DIR/live-before-publish.php; bye" >/dev/null
          cmp "$DIR/original.php" "$DIR/live-before-publish.php"
          # Backups and staging are OUTSIDE the public document root.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/original.php -o $BACKUP; get $BACKUP -o $DIR/backup-check.php; put $DIR/patched.php -o $STAGE; get $STAGE -o $DIR/stage-check.php; bye" >/dev/null
          cmp "$DIR/original.php" "$DIR/backup-check.php"
          cmp "$DIR/patched.php" "$DIR/stage-check.php"
          echo "Verified private backup and tested new OAuth PHP."
          SWITCH_ATTEMPTED=1
          # AZ.pl rejects SFTP rename for this live path. Existing RentMor deploys
          # use put-to-target. A VERIFIED private backup is available for rollback.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/patched.php -o $LIVE; get $LIVE -o $DIR/readback.php; bye" >/dev/null
          cmp "$DIR/patched.php" "$DIR/readback.php"
          curl --fail --silent --show-error --max-time 30 'https://rentmor.pl/rentmor-control-mcp/oauth.php?op=metadata' |
            python3 -c 'import sys,json; j=json.load(sys.stdin); assert j.get("issuer")=="https://rentmor.pl/rentmor-control-mcp"; print("OAuth metadata: HTTP 200 and issuer verified")'
          curl --fail --silent --show-error --max-time 30 'https://rentmor.pl/.well-known/oauth-protected-resource/rentmor-control-mcp/index.php' |
            python3 -c 'import sys,json; j=json.load(sys.stdin); assert j.get("resource")=="https://rentmor.pl/rentmor-control-mcp/index.php"; print("Resource metadata: HTTP 200 and resource verified")'
          VERIFIED=1
          echo "Retry-safe OAuth fix published; only oauth.php changed. Prior version backed up privately."
