name: Synchronize completed AI knowledge progress
on:
  push:
    branches: [codex/admin-ai-knowledge-20261110]
    paths: [.github/workflows/knowledge-progress-sync.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'paramiko==3.5.1' --quiet
      - name: Private progress documents with exact SHA preflight
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/ai-knowledge/sync_progress.py
