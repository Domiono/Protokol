name: Publish RentMor Control password change form
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mcp-password-form.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and upload single password form
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp
          source scripts/secure_sftp_connection.sh
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/rentmor-control-mcp/oauth_core.php -o $TMP/oauth_core.php; bye" >/dev/null
          php -l scripts/mcp_owner_change_password.php
          php -l "$TMP/oauth_core.php"
          python3 scripts/test_mcp_owner_change_password.py "$TMP/oauth_core.php"
          FILE=public_html/rentmor-control-mcp/change-password.php
          if lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $FILE -o $TMP/existing.php; bye" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing password form."
            exit 1
          fi
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put scripts/mcp_owner_change_password.php -o $FILE; get $FILE -o $TMP/readback.php; bye" >/dev/null
          cmp scripts/mcp_owner_change_password.php "$TMP/readback.php"
          curl -fLsS --max-time 25 https://rentmor.pl/rentmor-control-mcp/change-password.php -o "$TMP/form.html"
          grep -q 'Zmiana hasła właściciela' "$TMP/form.html"
          echo "Password change form deployed and HTTPS verified."
