name: Remove temporary RentMor Control password-change page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-mcp-password-form.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentmor-control-remove-password-form
  cancel-in-progress: false

jobs:
  remove-page:
    if: github.repository == 'Domiono/Protokol'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete only verified temporary form via AZ.pl SFTP
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing server}"
          : "${FTP_USERNAME:?Missing user}"
          : "${LFTP_PASSWORD:?Missing password}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          source scripts/secure_sftp_connection.sh
          umask 077
          TMP="$(mktemp -d "$RUNNER_TEMP/rm-change-form-remove.XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          BASE='public_html/rentmor-control-mcp'
          FILE="$BASE/change-password.php"
          # Safe identity check: refuse to delete if owner changed this file.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $FILE -o $TMP/live.php; bye" >/dev/null
          if ! cmp -s scripts/mcp_owner_change_password.php "$TMP/live.php"; then
            echo "::error::Live password-change file is not the version deployed by GitHub; refusing deletion."
            exit 1
          fi
          echo 'Temporary password-change page matches previously deployed source.'
          # Only the single, fully qualified, fixed temporary path is removed.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm $FILE; bye" >/dev/null
          NAMES="$(lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; cls -1 $BASE; bye")"
          if printf '%s\n' "$NAMES" | grep -Fxq 'change-password.php'; then
            echo "::error::Temporary page still exists according to SFTP."
            exit 1
          fi
          echo 'SFTP confirms temporary password-change page no longer exists.'
          CODE="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' --header 'Cache-Control: no-cache' 'https://rentmor.pl/rentmor-control-mcp/change-password.php')"
          if [ "$CODE" = '200' ]; then
            echo "::error::Password-change page still publicly available (HTTP 200)."
            exit 1
          fi
          echo "Password-change URL no longer publicly available (HTTP $CODE)."
          curl --fail --silent --show-error --max-time 30 'https://rentmor.pl/rentmor-control-mcp/oauth.php?op=metadata' |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("issuer")=="https://rentmor.pl/rentmor-control-mcp"; print("OAuth metadata remains healthy.")'
          echo 'SUCCESS: only the temporary password-change page was deleted.'
