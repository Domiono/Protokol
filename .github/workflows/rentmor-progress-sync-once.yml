name: Save RentMor progress to private server
on:
  push:
    branches: [codex/rentmor-progress-20261110]
    paths: [.github/workflows/rentmor-progress-sync-once.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'paramiko==3.5.1'
      - name: Save only two project notes with private rights and verified readback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/progress-sync/sync.py
