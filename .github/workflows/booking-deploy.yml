name: Sync multi equipment completion notes
on:
  push:
    branches: [codex/multi-equipment-reservations-20261116]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-hosting-publication
  cancel-in-progress: false
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/assert_github_test_only.py
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Sync only the two private completion documents
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/multi-equipment/publish.py --progress-only
