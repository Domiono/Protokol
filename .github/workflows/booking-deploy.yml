name: Publish rental terms corrections
on:
  push:
    branches: [codex/rental-terms-20261113]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-rental-terms
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test templates and narrow catalogue patch
        run: |
          php -l server/seo_structure.php
          php -l server/rental_offer_details.php
          php -l server/zasady.php
          php scripts/test_offer_details.php
          php scripts/test_seo_structure.php
          python3 deployment/rental-terms/test_patch.py
          python3 -m py_compile deployment/rental-terms/publish.py
          python3 scripts/assert_github_test_only.py
      - run: python3 -m pip install paramiko==3.5.1
      - name: Publish with guards private backup rollback and public verification
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/rental-terms/publish.py
