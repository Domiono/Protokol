name: Sync calendar publication documentation
# Checkpointed verification attempt 5: verified SFTP write with backup and recovery
on:
  push:
    branches: [codex/booking-calendar-20261111]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-full-booking-calendar
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m py_compile deployment/booking-calendar/deploy_calendar.py
      - run: python3 -m pip install paramiko==3.5.1
      - name: Publish calendar with baseline checks backup rollback and public verification
        env:
          BOOKING_PROGRESS_ONLY: '1'
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/booking-calendar/deploy_calendar.py
