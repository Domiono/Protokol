name: Publish booking message field stylesheet
on:
  push:
    branches: [codex/booking-calendar-20261111]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  publish-css:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install SFTP client
        run: python3 -m pip install paramiko==3.5.1
      - name: Synthetic transaction tests
        run: |
          python3 deployment/booking-calendar/test_css_deploy.py
          node --check server/mortii.js
          node scripts/test_booking_calendar_dom.cjs
          python3 scripts/assert_github_test_only.py
      - name: Publish only public stylesheet with rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/booking-calendar/deploy_css.py
