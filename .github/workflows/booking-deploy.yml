name: Test and publish automatic page statistics
on:
  push:
    branches: [codex/page-statistics-20261117]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-hosting-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test server and guarded publication
        run: |
          python3 scripts/assert_github_test_only.py
          python3 deployment/page-statistics/test_transaction.py
          php -l server/browser_stats.php
          php -l server/page_statistics.php
          php -l server/public_metadata.php
          php scripts/test_public_metadata.php
          python3 scripts/test_browser_stats.py
          python3 scripts/test_page_statistics.py
          python3 scripts/test_seo_structure_http.py
          php -l server/admin.php
          php -l server/protocol_sync.php
          php -l server/rental_inventory.php
          php scripts/test_rental_rules.php
          php scripts/test_multi_equipment_calendar.php
          python3 scripts/test_rental_api.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMOR_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_JSON: ${{ secrets.RENTMOR_FIREBASE_ANDROID_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rentmor-release.jks"
          if [ -n "$FIREBASE_ANDROID_JSON" ]; then printf '%s' "$FIREBASE_ANDROID_JSON" > app/google-services.json; fi
      - name: Full Android tests and signed release 1.7.38
        env:
          RENTMOR_KEYSTORE_PATH: ${{ runner.temp }}/rentmor-release.jks
          RENTMOR_KEYSTORE_PASSWORD: ${{ secrets.RENTMOR_KEYSTORE_PASSWORD }}
          RENTMOR_KEY_ALIAS: ${{ secrets.RENTMOR_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Publish exact patches and same signer update
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/page-statistics/publish.py
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rentmor-release.jks" app/google-services.json
