name: Synchronize confirmed contextual link publication
on:
  push:
    branches: [codex/full-offer-editor-20261113]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-hosting-publication
  cancel-in-progress: false
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Sync only private progress with readback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TASK_LINKS_PROGRESS_ONLY: '1'
        run: python3 deployment/task-links/publish.py
