name: One-time RentMor booking buffer notes sync
on:
  push:
    branches: [fix/booking-calendar-time-buffer-20261113]
    paths:
      - .github/workflows/booking-deploy.yml
permissions:
  contents: read
jobs:
  publish:
    if: "github.repository == 'Domiono/Protokol' && github.ref == 'refs/heads/fix/booking-calendar-time-buffer-20261113' && github.event.head_commit.message != 'chore: sync booking buffer notes'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source and regression fixtures
        run: |
          php -l server/booking_schedule.php
          php -l server/booking_calendar_rules.php
          php -l server/rental_inventory.php
          php scripts/test_booking_calendar.php
          php scripts/test_rental_rules.php
          node --check server/mortii.js
          node scripts/test_booking_calendar_dom.cjs
          python3 -m py_compile deployment/booking-calendar/deploy_buffer_fix.py
          python3 scripts/assert_github_test_only.py
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Publish guarded sources, verify public API and retain rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/booking-calendar/deploy_buffer_fix.py
  sync_notes:
    if: "github.repository == 'Domiono/Protokol' && github.ref == 'refs/heads/fix/booking-calendar-time-buffer-20261113' && github.event.head_commit.message == 'chore: sync booking buffer notes'"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned SFTP client
        run: python3 -m pip install --disable-pip-version-check paramiko==3.5.1
      - name: Publish only confirmed project notes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/progress-sync/sync.py
