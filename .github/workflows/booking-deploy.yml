name: Sync confirmed statistics publication notes
on:
  push:
    branches: [codex/page-statistics-20261117]
    paths: [.github/workflows/booking-deploy.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-hosting-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/assert_github_test_only.py
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Sync two notes and verify published source hashes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/page-statistics/sync_final.py
