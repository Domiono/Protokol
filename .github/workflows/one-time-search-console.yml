name: Synchronize final Search Console progress
on:
  push:
    branches: ['codex/search-console-publish-20261110']
permissions:
  contents: read
concurrency:
  group: rentmor-search-console-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install paramiko==3.5.1
      - name: Synchronize only the two private progress documents
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/search-console/publish_ssh.py --progress-only
