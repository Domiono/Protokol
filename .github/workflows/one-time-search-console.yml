name: One-time owner-requested Search Console publication
on:
  push:
    branches: ['codex/search-console-publish-20261110']
permissions:
  contents: read
concurrency:
  group: rentmor-search-console-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated Search Console code
        run: |
          php -l server/search_console.php
          php -l server/search_console_admin.php
          php scripts/test_search_console.php
          python3 scripts/test_search_console_patch.py
          python3 scripts/test_search_console_http.py
          php -l deployment/search-console/remote.php
          python3 scripts/test_search_console_deploy.py
      - run: python3 -m pip install paramiko==3.5.1
      - name: Patch current panel and verify private progress copies
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/search-console/publish_ssh.py
