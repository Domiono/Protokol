name: Synchronize final native Search Console notes
on:
  push:
    branches: [codex/android-search-console-publish-20261110]
    paths: [.github/workflows/one-time-native-search-console.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-native-search-console-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install paramiko==3.5.1 --quiet
      - name: Synchronize only two private progress documents
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/android-search-console/publish.py --progress-only
