            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $TITLE_DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $TITLE_DIR/backup.php -o public_html/.rentmor-backups/data-before-seo-titles-$GITHUB_RUN_ID.php; get public_html/data.json -o $TITLE_DIR/current.json; bye"
