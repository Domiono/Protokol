name: Deploy RentMor API
on:
  push:
    branches: [ main ]
    paths:
      - 'server/protocol_sync.php'
      - '.github/workflows/deploy-rentmor.yml'
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets are not configured yet; deployment skipped."
          fi

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install lftp
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload only protocol_sync.php over explicit FTPS
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          PORT="21"
          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_SERVER};
            put server/protocol_sync.php -o protocol_sync.php;
            bye
          "

# Deployment connection test
