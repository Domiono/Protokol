      - name: Canonical host redirect with immediate smoke test and rollback
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          source scripts/secure_sftp_connection.sh
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/.htaccess -o $TEMP_DIR/current.htaccess; bye"
          cmp "$TEMP_DIR/original.htaccess" "$TEMP_DIR/current.htaccess"
          if ! cmp -s "$TEMP_DIR/original.htaccess" "$TEMP_DIR/.htaccess"; then
            printf 'Require all denied\n' > "$TEMP_DIR/backup.htaccess"
            printf '<?php http_response_code(404); exit; ?>\n' > "$TEMP_DIR/htaccess-backup.php"
            cat "$TEMP_DIR/original.htaccess" >> "$TEMP_DIR/htaccess-backup.php"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $TEMP_DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $TEMP_DIR/htaccess-backup.php -o public_html/.rentmor-backups/htaccess-before-seo-$GITHUB_RUN_ID.php; put $TEMP_DIR/.htaccess -o public_html/.htaccess; get public_html/.htaccess -o $TEMP_DIR/deployed.htaccess; bye"
            cmp "$TEMP_DIR/.htaccess" "$TEMP_DIR/deployed.htaccess"
            if ! python3 scripts/verify_seo_improvements.py --redirects-only; then
              echo "Redirect verification failed. Restoring original .htaccess."
              lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TEMP_DIR/original.htaccess -o public_html/.htaccess; get public_html/.htaccess -o $TEMP_DIR/restored.htaccess; bye"
              cmp "$TEMP_DIR/original.htaccess" "$TEMP_DIR/restored.htaccess"
              exit 1
            fi
          fi

      - name: Verify public SEO after deployment
