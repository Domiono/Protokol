name: Deploy RentMor API
on:
  push:
    branches: [ main ]
    paths:
      - 'server/protocol_sync.php'
      - 'server/admin.php'
      - 'server/online.php'
      - 'server/online.js'
      - 'scripts/inject_online_tracker.py'
      - '.github/workflows/deploy-rentmor.yml'
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets are not configured yet; deployment skipped."
          fi

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install lftp
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload RentMor PHP files over FTP
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD}"

          # Pass credentials as process arguments, not by interpolating them
          # into lftp's command language. This avoids quote/shell parsing issues.
          LFTP_COMMAND="set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:passive-mode yes; put server/protocol_sync.php -o public_html/protocol_sync.php; put server/online.php -o public_html/online.php; put server/online.js -o public_html/online.js"
          if [ -f server/admin.php ]; then
            LFTP_COMMAND="$LFTP_COMMAND; put server/admin.php -o public_html/admin.php"
          else
            echo "server/admin.php not present in repository; admin.php upload skipped"
          fi
          lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftp://${FTP_SERVER}" -e "$LFTP_COMMAND; bye"

      - name: Embed online tracker in the current public site
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Download the ACTUAL live index.php so recent site changes are preserved.
          lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftp://${FTP_SERVER}" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:passive-mode yes; get public_html/index.php -o $TEMP_DIR/index.php; bye"
          cp "$TEMP_DIR/index.php" "$TEMP_DIR/original.php"
          python3 scripts/inject_online_tracker.py "$TEMP_DIR/index.php"

          if cmp -s "$TEMP_DIR/original.php" "$TEMP_DIR/index.php"; then
            echo "Online tracker already present in the live homepage."
          else
            # Upload only the one-script insertion, never an outdated index snapshot.
            lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftp://${FTP_SERVER}" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:passive-mode yes; put $TEMP_DIR/index.php -o public_html/index.php; bye"
            echo "Public homepage updated with online tracking."
          fi
