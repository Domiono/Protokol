          cmp server/performance_images_v2.php "$RUNNER_TEMP/image-helper-readback.php"

      - name: Publish and verify static CSS before switching production PHP
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          CSS="$(find "$TEMP_DIR/css" -maxdepth 1 -name 'rentmor-tailwind-*.css' -type f -print -quit)"
          test -s "$CSS"
          NAME="$(basename "$CSS")"
          ICON="$(find "$TEMP_DIR/icons" -maxdepth 1 -name 'rentmor-favicon-*.png' -type f -print -quit)"
          test -s "$ICON"
          ICON_NAME="$(basename "$ICON")"
          source scripts/secure_sftp_connection.sh
          # Only mkdir may fail if already present; uploaded CSS/readback must succeed.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/assets; set cmd:fail-exit yes; put $CSS -o public_html/assets/$NAME; get public_html/assets/$NAME -o $TEMP_DIR/css-readback.css; put $ICON -o public_html/assets/$ICON_NAME; get public_html/assets/$ICON_NAME -o $TEMP_DIR/favicon-readback.png; bye"
          cmp "$CSS" "$TEMP_DIR/css-readback.css"
          cmp "$ICON" "$TEMP_DIR/favicon-readback.png"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 45 \
            "https://rentmor.pl/assets/$NAME" -o "$TEMP_DIR/css-public.css"
          cmp "$CSS" "$TEMP_DIR/css-public.css"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 45             "https://rentmor.pl/assets/$ICON_NAME" -o "$TEMP_DIR/favicon-public.png"
          cmp "$ICON" "$TEMP_DIR/favicon-public.png"
          for ASSET in server/assets/rm-* server/assets/rentmor-favicon-*.png; do
            ASSET_NAME="$(basename "$ASSET")"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $ASSET -o public_html/assets/$ASSET_NAME; bye"
            curl --fail --silent --show-error --retry 3 --max-time 45 "https://rentmor.pl/assets/$ASSET_NAME" -o "$TEMP_DIR/brand-readback"
            cmp "$ASSET" "$TEMP_DIR/brand-readback"
          done
          echo "Static CSS and tiny favicon published and verified before PHP change."

      - name: Install Firebase key into PHP runtime private directory (HTTPS)
        if: steps.config.outputs.enabled == 'true' && steps.scope.outputs.public_only != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.RENTMOR_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase sender secret is absent. Push notifications remain disabled."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/rentmor-fcm-service-account.json"
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          php -r '
            $a=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            if(!is_array($a)||($a["project_id"]??"")!=="rentmor-c64bd"||
               ($a["type"]??"")!=="service_account"||empty($a["client_email"])||empty($a["private_key"]))exit(1);
            echo "Firebase service account project and format validated.\n";
          ' "$KEY_FILE"

          source scripts/secure_sftp_connection.sh
          TMP_DIR="$RUNNER_TEMP/rentmor-fcm-install"
          mkdir -m 700 -p "$TMP_DIR"
          PROBE="rm-fcm-install-$(openssl rand -hex 14).php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          python3 - "$TOKEN_HASH" "$TMP_DIR/installer.php" <<'PY'
          import pathlib,sys
          template=pathlib.Path("scripts/fcm_runtime_installer.php.template").read_text()
          assert template.count("__AUTH_HASH__")==1
          pathlib.Path(sys.argv[2]).write_text(template.replace("__AUTH_HASH__",sys.argv[1]))
          PY
          php -l "$TMP_DIR/installer.php"
          cleanup() {
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm public_html/$PROBE; bye" || true
            rm -rf "$TMP_DIR" "$KEY_FILE"
          }
          trap cleanup EXIT
          # The temporary endpoint accepts ONLY POST with an unguessable token
          # and writes the secret OUTSIDE public_html directly as the PHP user.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TMP_DIR/installer.php -o public_html/$PROBE; bye"
          RESPONSE="$(curl --fail --silent --show-error --max-time 30 --request POST \
            --header "X-RentMor-Probe: $TOKEN" \
            --header 'Content-Type: application/json' --data-binary "@$KEY_FILE" \
            "https://rentmor.pl/$PROBE")"
          printf '%s' "$RESPONSE" | python3 -c 'import sys,json; a=json.load(sys.stdin); assert a.get("ok") and a.get("result")=="configured_and_readable", a.get("result"); print("PHP verified Firebase key stored and readable above the document root.")'

      - name: Diagnose authorized Firebase tokens (no private data in logs)
        if: steps.config.outputs.enabled == 'true' && steps.scope.outputs.public_only != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          source scripts/secure_sftp_connection.sh
          PRIVATE_DIR="$RUNNER_TEMP/rentmor-push-diagnostic"
          mkdir -p "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          trap 'rm -rf "$PRIVATE_DIR"' EXIT
          # Snapshot the protected files into ephemeral CI storage; never log contents.
          # A missing registry is expected before the first admin device registration.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; get public_html/protocol_devices.json -o $PRIVATE_DIR/devices.json; cd public_html; cd ..; get rentmor-private/fcm-tokens.json -o $PRIVATE_DIR/tokens.json; bye" || true
          python3 scripts/diagnose_push_registry.py "$PRIVATE_DIR/devices.json" "$PRIVATE_DIR/tokens.json"

      - name: Move rental and finance records outside public_html (verified rollback)
        # Never retry the rental-data cutover on push or pull_request. Explicit manual opt-in only.
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_private_data == true && steps.config.outputs.enabled == 'true' && steps.scope.outputs.public_only != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          source scripts/secure_sftp_connection.sh
          DIR="$RUNNER_TEMP/rentmor-data-cutover"
          mkdir -m 700 -p "$DIR"
          DEST="rentmor-private/rental-data"
          trap 'rm -rf "$DIR"' EXIT
          # Check marker before doing anything: rerunning an already migrated deploy must be harmless.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; get $DEST/active.flag -o $DIR/active.flag; bye" >/dev/null 2>&1 || true
          if [ -f "$DIR/active.flag" ] && grep -Fxq "verified" "$DIR/active.flag"; then
            echo "Private rental storage already active; no migration necessary."
            exit 0
          fi
          printf 'maintenance\n' > "$DIR/maintenance.flag"
          printf 'verified\n' > "$DIR/ready.flag"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p $DEST; set cmd:fail-exit yes; put $DIR/maintenance.flag -o $DEST/maintenance.flag; bye"
          cleanup() {
            if [ "$CUTOVER_ACTIVE" = "1" ] && [ "$CUTOVER_COMMITTED" != "1" ]; then
              lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm $DEST/active.flag; bye" >/dev/null 2>&1 || true
            fi
            if [ -n "${PROBE:-}" ]; then lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm public_html/$PROBE; bye" >/dev/null 2>&1 || true; fi
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm $DEST/maintenance.flag; bye" >/dev/null 2>&1 || true
            rm -rf "$DIR"
          }
          CUTOVER_ACTIVE=0
          CUTOVER_COMMITTED=0
          trap cleanup EXIT
          sleep 20
          for name in reservations.json protocols.json customers.json costs.json rental_assets.php; do
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/$name -o $DIR/$name; bye" >/dev/null
          done
          python3 scripts/check_private_migration.py "$DIR"
          for name in reservations.json protocols.json customers.json costs.json rental_assets.php; do
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/$name -o $DEST/$name; get $DEST/$name -o $DIR/verified-$name; bye" >/dev/null
            cmp "$DIR/$name" "$DIR/verified-$name"
          done
          # Cut-over only after all five validated copies have been read back byte-for-byte.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/ready.flag -o $DEST/active.flag; bye"
          CUTOVER_ACTIVE=1
          # A one-time credentialed PHP probe verifies the web worker sees and can
          # modify all five private files. No customer or finance values are returned.
          PROBE="rm-storage-probe-$(openssl rand -hex 12).php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          sed "s/__AUTH_HASH__/$TOKEN_HASH/g" scripts/private_rental_probe.php.template > "$DIR/probe.php"
          php -l "$DIR/probe.php"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/probe.php -o public_html/$PROBE; bye"
          RESPONSE="$(curl --silent --show-error --max-time 30 --request POST --header "X-RentMor-Probe: $TOKEN" "https://rentmor.pl/$PROBE")"
          printf '%s' "$RESPONSE" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("php_read_write") is True'
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm public_html/$PROBE; bye"
          PROBE=""
          # Keep writes paused until PHP confirmed readable/writable private files.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm $DEST/maintenance.flag; bye"

          STATUS_ADMIN="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 https://rentmor.pl/admin.php)"
          STATUS_API="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 https://rentmor.pl/protocol_sync.php)"
          if [ "$STATUS_ADMIN" != 200 ] || [ "$STATUS_API" != 401 ]; then
            # All originals still exist: safely switch back to original data.
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm $DEST/active.flag; bye"
            echo "::error::Private cut-over failed public smoke test and was rolled back."
            exit 1
          fi
          # From this point new writes use private files; do not roll back to stale originals.
          CUTOVER_COMMITTED=1
          # Originals are moved to a private rollback directory, NOT deleted or published.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p $DEST/legacy-originals; set cmd:fail-exit yes; bye"
          for name in reservations.json protocols.json customers.json costs.json rental_assets.php; do
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; mv public_html/$name $DEST/legacy-originals/$name; bye"
          done
          echo "Private rental cut-over complete: all five originals moved outside document root."

      - name: Publish prepared homepage with backup
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          source scripts/secure_sftp_connection.sh
          # Refuse to overwrite a homepage edited after preparation.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/current.php; bye"
          cmp "$TEMP_DIR/current.php" "$TEMP_DIR/original.php"
          if cmp -s "$TEMP_DIR/original.php" "$TEMP_DIR/index.php"; then
            echo "Online tracker already present in the live homepage."
          else
            # Store a non-executable, HTTP-blocked backup before replacing the live index.
            # SFTP may report failure when the backup directory already exists.
            # Only mkdir is best-effort; every backup upload must still succeed.
            printf 'Require all denied\n' > "$TEMP_DIR/backup.htaccess"
            printf '<?php http_response_code(404); exit; ?>\n' > "$TEMP_DIR/backup.php"
            cat "$TEMP_DIR/original.php" >> "$TEMP_DIR/backup.php"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $TEMP_DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $TEMP_DIR/backup.php -o public_html/.rentmor-backups/index-before-site-update-$GITHUB_RUN_ID.php; put $TEMP_DIR/index.php -o public_html/index.php; bye"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/deployed.php; bye"
            cmp "$TEMP_DIR/index.php" "$TEMP_DIR/deployed.php"
            echo "Public homepage uploaded and verified."
          fi
          # Immediately recover the original homepage if the stylesheet or
          # public product rendering fails the smoke tests.
          if ! python3 scripts/verify_mobile_rendering.py || ! python3 scripts/verify_static_tailwind.py || ! python3 scripts/verify_fast_gallery.py || ! python3 scripts/verify_deferred_fonts.py; then
            echo "Static CSS smoke test failed; restoring original homepage."
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TEMP_DIR/original.php -o public_html/index.php; get public_html/index.php -o $TEMP_DIR/restored.php; bye"
            cmp "$TEMP_DIR/original.php" "$TEMP_DIR/restored.php"
            exit 1
          fi


