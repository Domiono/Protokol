name: Deploy RentMor API
on:
  push:
    branches: [ main ]
    paths:
      - 'server/protocol_sync.php'
      - 'server/push_bridge.php'
      - 'scripts/patch_contact_push.py'
      - 'scripts/test_push_hook.py'
      - 'scripts/diagnose_push_registry.py'
      - 'scripts/fcm_runtime_installer.php.template'
      - 'server/admin.php'
      - 'server/online.php'
      - 'server/traffic_filter.php'
      - 'scripts/patch_statistics_filter.py'
      - 'scripts/test_statistics_filter.py'
      - 'server/online.js'
      - 'server/sitemap.php'
      - 'server/poradnik-jaki-papier-scierny-do-zyrafy.php'
      - 'server/poradnik-pranie-tapicerki-karcher-puzzi.php'
      - 'server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php'
      - 'scripts/inject_airless_guide_link.py'
      - 'scripts/test_inject_airless_guide_link.py'
      - 'scripts/inject_local_seo.py'
      - 'scripts/test_inject_local_seo.py'
      - 'scripts/inject_guide_link.py'
      - 'scripts/verify_public_seo.py'
      - 'scripts/test_public_seo.py'
      - 'server/robots.txt'
      - 'server/product_description.php'
      - 'scripts/patch_public_product_layout.py'
      - 'scripts/patch_wt20i_offer.py'
      - 'scripts/inject_online_tracker.py'
      - 'scripts/secure_sftp_connection.sh'
      - '.github/workflows/deploy-rentmor.yml'
  workflow_dispatch:

concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$LFTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets are not configured yet; deployment skipped."
          fi

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install lftp
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp php-cli

      - name: Validate sitemap generator and description formatter
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -eu
          python3 scripts/test_public_seo.py
          python3 scripts/test_inject_local_seo.py
          python3 scripts/test_inject_airless_guide_link.py
          php -l server/traffic_filter.php
          php -l server/admin.php
          php -l server/online.php
          php -l server/protocol_sync.php
          php -l server/push_bridge.php
          php -l scripts/fcm_runtime_installer.php.template
          python3 scripts/test_push_hook.py
          python3 scripts/test_statistics_filter.py
          php -l server/poradnik-jaki-papier-scierny-do-zyrafy.php
          php -l server/poradnik-pranie-tapicerki-karcher-puzzi.php
          php -l server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php
          python3 -m py_compile scripts/inject_guide_link.py
          python3 -m py_compile scripts/inject_local_seo.py
          python3 -m py_compile scripts/inject_airless_guide_link.py
          php -l server/sitemap.php
          php -l server/product_description.php
          python3 -m py_compile scripts/patch_public_product_layout.py
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          cp server/sitemap.php "$TEST_DIR/sitemap.php"
          cp server/poradnik-jaki-papier-scierny-do-zyrafy.php "$TEST_DIR/"
          cp server/poradnik-pranie-tapicerki-karcher-puzzi.php "$TEST_DIR/"
          cp server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php "$TEST_DIR/"
          printf 'Rental terms test page' > "$TEST_DIR/zasady.php"
          printf '[{"name":"Szlifierka betonowa"},{"name":"Odkurzacz Puzzi"}]' > "$TEST_DIR/data.json"
          php "$TEST_DIR/sitemap.php" > "$TEST_DIR/sitemap.xml"
          python3 - "$TEST_DIR/sitemap.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          urls = [x.text for x in root.iter() if x.tag.endswith('loc')]
          for needed in ['https://rentmor.pl/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php','https://rentmor.pl/poradnik-pranie-tapicerki-karcher-puzzi.php','https://rentmor.pl/poradnik-jaki-papier-scierny-do-zyrafy.php', 'https://rentmor.pl/', 'https://rentmor.pl/zasady.php', 'https://rentmor.pl/szlifierka-betonowa/', 'https://rentmor.pl/odkurzacz-puzzi/']:
              assert needed in urls, (needed, urls)
          print('Sitemap XML and rental terms test passed.')
          PY
          php -r 'require "server/product_description.php"; $html=rentmor_render_description("Parametry:\n- Moc 2200 W\n\n<strong>unsafe</strong>"); if (!str_contains($html, "&lt;strong&gt;unsafe&lt;/strong&gt;") || !str_contains($html, "<ul")) exit(1); echo "Description formatter test passed.\n";'

      - name: Prepare and validate current public site before upload
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          mkdir -p "$TEMP_DIR"
          source scripts/secure_sftp_connection.sh

          # Download the ACTUAL live index.php so recent site changes are preserved.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/index.php; bye"
          cp "$TEMP_DIR/index.php" "$TEMP_DIR/original.php"
          python3 scripts/patch_statistics_filter.py "$TEMP_DIR/index.php"
          python3 scripts/inject_online_tracker.py "$TEMP_DIR/index.php"
          python3 scripts/patch_public_product_layout.py "$TEMP_DIR/index.php"
          python3 scripts/inject_guide_link.py "$TEMP_DIR/index.php"
          python3 scripts/inject_local_seo.py "$TEMP_DIR/index.php"
          python3 scripts/inject_airless_guide_link.py "$TEMP_DIR/index.php"
          python3 scripts/patch_contact_push.py "$TEMP_DIR/index.php"
          php -l "$TEMP_DIR/index.php"

      - name: Upload validated RentMor files over SFTP
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${LFTP_PASSWORD:?Missing FTP_PASSWORD}"

          # Pass credentials as process arguments, not by interpolating them
          # into lftp's command language. This avoids quote/shell parsing issues.
          source scripts/secure_sftp_connection.sh
          LFTP_COMMAND="$SFTP_CONNECT_SETUP; put server/traffic_filter.php -o public_html/traffic_filter.php; put server/protocol_sync.php -o public_html/protocol_sync.php; put server/push_bridge.php -o public_html/push_bridge.php; put server/online.php -o public_html/online.php; put server/online.js -o public_html/online.js; put server/product_description.php -o public_html/product_description.php; put server/poradnik-jaki-papier-scierny-do-zyrafy.php -o public_html/poradnik-jaki-papier-scierny-do-zyrafy.php; put server/poradnik-pranie-tapicerki-karcher-puzzi.php -o public_html/poradnik-pranie-tapicerki-karcher-puzzi.php; put server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php -o public_html/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php; put server/sitemap.php -o public_html/sitemap.php; put server/robots.txt -o public_html/robots.txt"
          if [ -f server/admin.php ]; then
            LFTP_COMMAND="$LFTP_COMMAND; put server/admin.php -o public_html/admin.php"
          else
            echo "server/admin.php not present in repository; admin.php upload skipped"
          fi
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$LFTP_COMMAND; bye"

      - name: Install Firebase key into PHP runtime private directory (HTTPS)
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.RENTMOR_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase sender secret is absent. Push notifications remain disabled."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/rentmor-fcm-service-account.json"
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          php -r '
            $a=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            if(!is_array($a)||($a["project_id"]??"")!=="rentmor-c64bd"||
               ($a["type"]??"")!=="service_account"||empty($a["client_email"])||empty($a["private_key"]))exit(1);
            echo "Firebase service account project and format validated.\n";
          ' "$KEY_FILE"

          source scripts/secure_sftp_connection.sh
          TMP_DIR="$RUNNER_TEMP/rentmor-fcm-install"
          mkdir -m 700 -p "$TMP_DIR"
          PROBE="rm-fcm-install-$(openssl rand -hex 14).php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          python3 - "$TOKEN_HASH" "$TMP_DIR/installer.php" <<'PY'
          import pathlib,sys
          template=pathlib.Path("scripts/fcm_runtime_installer.php.template").read_text()
          assert template.count("__AUTH_HASH__")==1
          pathlib.Path(sys.argv[2]).write_text(template.replace("__AUTH_HASH__",sys.argv[1]))
          PY
          php -l "$TMP_DIR/installer.php"
          cleanup() {
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm public_html/$PROBE; bye" || true
            rm -rf "$TMP_DIR" "$KEY_FILE"
          }
          trap cleanup EXIT
          # The temporary endpoint accepts ONLY POST with an unguessable token
          # and writes the secret OUTSIDE public_html directly as the PHP user.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TMP_DIR/installer.php -o public_html/$PROBE; bye"
          RESPONSE="$(curl --fail --silent --show-error --max-time 30 --request POST \
            --header "X-RentMor-Probe: $TOKEN" \
            --header 'Content-Type: application/json' --data-binary "@$KEY_FILE" \
            "https://rentmor.pl/$PROBE")"
          printf '%s' "$RESPONSE" | python3 -c 'import sys,json; a=json.load(sys.stdin); assert a.get("ok") and a.get("result")=="configured_and_readable", a.get("result"); print("PHP verified Firebase key stored and readable above the document root.")'

      - name: Diagnose authorized Firebase tokens (no private data in logs)
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          source scripts/secure_sftp_connection.sh
          PRIVATE_DIR="$RUNNER_TEMP/rentmor-push-diagnostic"
          mkdir -p "$PRIVATE_DIR"
          chmod 700 "$PRIVATE_DIR"
          trap 'rm -rf "$PRIVATE_DIR"' EXIT
          # Snapshot the protected files into ephemeral CI storage; never log contents.
          # A missing registry is expected before the first admin device registration.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; get public_html/protocol_devices.json -o $PRIVATE_DIR/devices.json; cd public_html; cd ..; get rentmor-private/fcm-tokens.json -o $PRIVATE_DIR/tokens.json; bye" || true
          python3 scripts/diagnose_push_registry.py "$PRIVATE_DIR/devices.json" "$PRIVATE_DIR/tokens.json"

      - name: Publish prepared homepage with backup
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          source scripts/secure_sftp_connection.sh
          # Refuse to overwrite a homepage edited after preparation.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/current.php; bye"
          cmp "$TEMP_DIR/current.php" "$TEMP_DIR/original.php"
          if cmp -s "$TEMP_DIR/original.php" "$TEMP_DIR/index.php"; then
            echo "Online tracker already present in the live homepage."
          else
            # Store a non-executable, HTTP-blocked backup before replacing the live index.
            # SFTP may report failure when the backup directory already exists.
            # Only mkdir is best-effort; every backup upload must still succeed.
            printf 'Require all denied\n' > "$TEMP_DIR/backup.htaccess"
            printf '<?php http_response_code(404); exit; ?>\n' > "$TEMP_DIR/backup.php"
            cat "$TEMP_DIR/original.php" >> "$TEMP_DIR/backup.php"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $TEMP_DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $TEMP_DIR/backup.php -o public_html/.rentmor-backups/index-before-site-update-$GITHUB_RUN_ID.php; put $TEMP_DIR/index.php -o public_html/index.php; bye"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/deployed.php; bye"
            cmp "$TEMP_DIR/index.php" "$TEMP_DIR/deployed.php"
            echo "Public homepage uploaded and verified."
          fi


      - name: Correct approved WT20i offer parameters
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          OFFER_DIR="$RUNNER_TEMP/rentmor-wt20i-offer"
          mkdir -p "$OFFER_DIR"
          source scripts/secure_sftp_connection.sh
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/data.json -o $OFFER_DIR/original.json; bye"
          python3 scripts/patch_wt20i_offer.py "$OFFER_DIR/original.json" "$OFFER_DIR/updated.json"
          if ! cmp -s "$OFFER_DIR/original.json" "$OFFER_DIR/updated.json"; then
            printf 'Require all denied\n' > "$OFFER_DIR/backup.htaccess"
            printf '<?php http_response_code(404); exit; ?>\n' > "$OFFER_DIR/backup.php"
            cat "$OFFER_DIR/original.json" >> "$OFFER_DIR/backup.php"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $OFFER_DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $OFFER_DIR/backup.php -o public_html/.rentmor-backups/data-before-wt20i-$GITHUB_RUN_ID.php; put $OFFER_DIR/updated.json -o public_html/data-wt20i-$GITHUB_RUN_ID.tmp; get public_html/data.json -o $OFFER_DIR/current.json; bye"
            # Refuse to replace inventory changed since the original snapshot.
            if ! cmp -s "$OFFER_DIR/original.json" "$OFFER_DIR/current.json"; then
              lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; rm public_html/data-wt20i-$GITHUB_RUN_ID.tmp; bye"
              echo "Inventory changed during preparation; no replacement performed."
              exit 1
            fi
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; mv public_html/data-wt20i-$GITHUB_RUN_ID.tmp public_html/data.json; get public_html/data.json -o $OFFER_DIR/deployed.json; bye"
            cmp "$OFFER_DIR/updated.json" "$OFFER_DIR/deployed.json"
          fi

      - name: Verify public SEO after deployment
        if: steps.config.outputs.enabled == 'true'
        run: python3 scripts/verify_public_seo.py
