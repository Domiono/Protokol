name: Deploy RentMor API
on:
  push:
    branches: [ main ]
    paths:
      - 'server/protocol_sync.php'
      - 'server/notebook_sync.php'
      - 'scripts/test_notebook_sync.php'
      - 'server/push_bridge.php'
      - 'scripts/patch_contact_push.py'
      - 'scripts/test_push_hook.py'
      - 'scripts/diagnose_push_registry.py'
      - 'scripts/fcm_runtime_installer.php.template'
      - 'server/admin.php'
      - 'server/admin_safety.php'
      - 'server/admin_auth.php'
      - 'server/private_rental_files.php'
      - 'scripts/check_private_migration.py'
      - 'scripts/private_rental_probe.php.template'
      - 'scripts/test_private_rental_paths.py'
      - 'scripts/bootstrap_admin_auth.py'
      - 'scripts/admin_auth_runtime_installer.php.template'
      - 'scripts/test_admin_auth_installer.py'
      - 'scripts/test_admin_auth.php'
      - 'scripts/patch_private_data_access.py'
      - 'scripts/test_security_access.py'
      - 'server/rental_inventory.php'
      - 'scripts/patch_catalog_filters.py'
      - 'scripts/test_admin_safety.py'
      - 'scripts/backup_rentmor.py'
      - 'scripts/test_backup_rentmor.py'
      - 'scripts/monitor_public.py'
      - 'scripts/notify_health_failure.py'
      - 'scripts/test_catalog_filters.cjs'
      - 'server/online.php'
      - 'server/traffic_filter.php'
      - 'server/browser_stats.php'
      - 'server/pageview.php'
      - 'scripts/test_browser_stats.py'
      - 'scripts/test_browser_tracker.cjs'
      - 'scripts/patch_statistics_filter.py'
      - 'scripts/test_statistics_filter.py'
      - 'server/online.js'
      - 'server/phone_event.php'
      - 'server/phone_events.php'
      - 'server/phone_events_view.php'
      - 'scripts/test_phone_events.py'
      - 'server/sitemap.php'
      - 'server/poradnik-jaki-papier-scierny-do-zyrafy.php'
      - 'server/poradnik-pranie-tapicerki-karcher-puzzi.php'
      - 'server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php'
      - 'scripts/inject_airless_guide_link.py'
      - 'scripts/test_inject_airless_guide_link.py'
      - 'scripts/inject_local_seo.py'
      - 'scripts/test_inject_local_seo.py'
      - 'scripts/inject_guide_link.py'
      - 'scripts/verify_public_seo.py'
      - 'scripts/test_public_seo.py'
      - 'server/robots.txt'
      - 'server/product_description.php'
      - 'scripts/patch_public_product_layout.py'
      - 'scripts/patch_wt20i_offer.py'
      - 'server/rental_offer_details.php'
      - 'server/rental_offer_details_extra.php'
      - 'scripts/test_extra_offers.php'
      - 'server/related_offers.php'
      - 'scripts/test_related_offers.php'
      - 'server/performance_images.php'
      - 'assets/branding/**'
      - 'server/assets/rm-*'
      - 'server/assets/rentmor-favicon-*'
      - 'scripts/build_brand_icons.py'
      - 'scripts/patch_brand_icons.py'
      - 'scripts/test_brand_icons.py'
      - 'scripts/optimize_favicon.py'
      - 'scripts/test_optimize_favicon.py'
      - 'scripts/verify_fast_gallery.py'
      - 'scripts/patch_static_cards.py'
      - 'scripts/test_static_cards.py'
      - 'scripts/png_metadata.py'
      - 'scripts/patch_mobile_rendering.py'
      - 'scripts/test_mobile_rendering.py'
      - 'scripts/verify_mobile_rendering.py'
      - 'server/performance_images_v2.php'
      - 'scripts/patch_deferred_fonts.py'
      - 'scripts/test_deferred_fonts.py'
      - 'scripts/verify_deferred_fonts.py'
      - 'scripts/patch_performance_template.py'
      - 'scripts/build_public_tailwind.py'
      - 'scripts/patch_static_tailwind.py'
      - 'scripts/patch_static_css_cache.py'
      - 'scripts/test_static_tailwind.py'
      - 'scripts/verify_static_tailwind.py'
      - 'scripts/patch_image_cache.py'
      - 'server/rentmor-gallery.js'
      - 'server/rentmor-gallery.css'
      - 'scripts/patch_public_gallery.py'
      - '.github/workflows/deploy-gallery.yml'
      - '.github/workflows/deploy-rentmor-images.yml'
      - 'scripts/prepare_rentmor_images.py'
      - 'scripts/verify_rentmor_webp.py'
      - 'scripts/test_performance_images.py'
      - 'scripts/patch_seo_template.py'
      - 'scripts/patch_seo_titles.py'
      - 'scripts/patch_canonical_host.py'
      - 'scripts/test_seo_improvements.py'
      - 'scripts/test_offer_details.php'
      - 'scripts/verify_seo_improvements.py'
      - 'scripts/inject_online_tracker.py'
      - 'scripts/secure_sftp_connection.sh'
      - '.github/workflows/deploy-rentmor.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      migrate_private_data:
        description: 'Manualna migracja danych (tylko po sprawdzeniu sciezek i uprawnien PHP/SFTP)'
        type: boolean
        required: false
        default: false

concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false

jobs:
  seo-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Test SEO patches without production credentials
        run: |
          set -eu
          php -l scripts/admin_auth_runtime_installer.php.template
          python3 scripts/test_admin_auth_installer.py
          php -l server/private_rental_files.php
          python3 scripts/test_private_rental_paths.py
          python3 -m py_compile scripts/check_private_migration.py
          php -l scripts/private_rental_probe.php.template
          php -l server/admin_auth.php
          php scripts/test_admin_auth.php
          python3 scripts/test_monitor_security_events.py
          python3 -m py_compile scripts/bootstrap_admin_auth.py
          php -l server/admin_safety.php
          php -l server/rental_inventory.php
          python3 scripts/test_admin_safety.py
          python3 scripts/test_security_access.py
          python3 scripts/test_backup_rentmor.py
          python3 scripts/test_post_audit.py
          python3 -m py_compile scripts/backup_photos.py scripts/backup_retention.py scripts/verify_private_paths.py
          python3 scripts/monitor_public.py --self-test
          node scripts/test_catalog_filters.cjs
          php scripts/test_rental_rules.php
          python3 scripts/test_rental_api.py
          php -l server/browser_stats.php
          php -l server/pageview.php
          python3 scripts/test_browser_stats.py
          python3 scripts/test_statistics_filter.py
          node scripts/test_browser_tracker.cjs
          php -l server/phone_event.php
          php -l server/phone_events.php
          php -l server/phone_events_view.php
          python3 scripts/test_phone_events.py
          node scripts/test_phone_tracker.cjs
          python3 scripts/test_phone_history_patch.py
          python3 scripts/test_seo_improvements.py
          python3 scripts/test_static_tailwind.py
          python3 scripts/test_static_cards.py
          python3 scripts/test_mobile_rendering.py
          php -l server/performance_images_v2.php
          python3 scripts/test_deferred_fonts.py
          python3 -m py_compile scripts/patch_deferred_fonts.py scripts/verify_deferred_fonts.py
          python3 scripts/test_performance_images.py
          php -l server/performance_images.php
          python3 -m py_compile scripts/patch_performance_template.py scripts/patch_image_cache.py
          python3 -m venv "$RUNNER_TEMP/rentmor-perf-tests"
          "$RUNNER_TEMP/rentmor-perf-tests/bin/pip" -q install 'Pillow==11.3.0'
          "$RUNNER_TEMP/rentmor-perf-tests/bin/python" scripts/test_performance_images.py
          "$RUNNER_TEMP/rentmor-perf-tests/bin/python" scripts/test_static_cards.py
          "$RUNNER_TEMP/rentmor-perf-tests/bin/python" scripts/test_mobile_rendering.py
          "$RUNNER_TEMP/rentmor-perf-tests/bin/python" scripts/test_optimize_favicon.py
          "$RUNNER_TEMP/rentmor-perf-tests/bin/python" scripts/test_brand_icons.py
          python3 -m py_compile scripts/build_public_tailwind.py scripts/patch_static_tailwind.py scripts/verify_static_tailwind.py scripts/patch_static_css_cache.py
          python3 -m py_compile scripts/patch_seo_template.py scripts/patch_seo_titles.py scripts/patch_canonical_host.py scripts/verify_seo_improvements.py
          php -l server/rental_offer_details.php
          php -l server/rental_offer_details_extra.php
          php scripts/test_offer_details.php
          php scripts/test_extra_offers.php
          php -l server/related_offers.php
          php scripts/test_related_offers.php

  deploy-api:
    needs: seo-preflight
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$LFTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets are not configured yet; deployment skipped."
          fi

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp php-cli

      - name: Validate sitemap generator and description formatter
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -eu
          python3 scripts/test_public_seo.py
          python3 scripts/test_seo_improvements.py
          python3 scripts/test_static_tailwind.py
          python3 scripts/test_static_cards.py
          python3 scripts/test_mobile_rendering.py
          php -l server/performance_images_v2.php
          python3 scripts/test_deferred_fonts.py
          python3 -m py_compile scripts/patch_deferred_fonts.py scripts/verify_deferred_fonts.py
          python3 scripts/test_performance_images.py
          php -l server/performance_images.php
          node --check server/rentmor-gallery.js
          python3 -m py_compile scripts/optimize_favicon.py scripts/verify_fast_gallery.py
          php -l server/rental_offer_details.php
          php -l server/rental_offer_details_extra.php
          php scripts/test_offer_details.php
          php scripts/test_extra_offers.php
          php -l server/related_offers.php
          php scripts/test_related_offers.php
          python3 scripts/test_inject_local_seo.py
          python3 scripts/test_inject_airless_guide_link.py
          php -l server/traffic_filter.php
          php -l server/admin_auth.php
          php scripts/test_admin_auth.php
          php -l server/admin.php
          php -l server/browser_stats.php
          php -l server/pageview.php
          python3 scripts/test_browser_stats.py
          python3 scripts/test_statistics_filter.py
          node scripts/test_browser_tracker.cjs
          php -l server/phone_event.php
          php -l server/phone_events.php
          php -l server/phone_events_view.php
          python3 scripts/test_phone_events.py
          php -l server/online.php
          php -l server/protocol_sync.php
          php -l server/notebook_sync.php
          php scripts/test_notebook_sync.php
          php -l server/push_bridge.php
          php -l scripts/fcm_runtime_installer.php.template
          python3 scripts/test_push_hook.py
          python3 scripts/test_statistics_filter.py
          php -l server/poradnik-jaki-papier-scierny-do-zyrafy.php
          php -l server/poradnik-pranie-tapicerki-karcher-puzzi.php
          php -l server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php
          python3 -m py_compile scripts/inject_guide_link.py
          python3 -m py_compile scripts/inject_local_seo.py
          python3 -m py_compile scripts/inject_airless_guide_link.py
          php -l server/sitemap.php
          php -l server/product_description.php
          python3 -m py_compile scripts/patch_public_product_layout.py
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          cp server/sitemap.php "$TEST_DIR/sitemap.php"
          cp server/poradnik-jaki-papier-scierny-do-zyrafy.php "$TEST_DIR/"
          cp server/poradnik-pranie-tapicerki-karcher-puzzi.php "$TEST_DIR/"
          cp server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php "$TEST_DIR/"
          printf 'Rental terms test page' > "$TEST_DIR/zasady.php"
          printf '[{"name":"Szlifierka betonowa"},{"name":"Odkurzacz Puzzi"}]' > "$TEST_DIR/data.json"
          php "$TEST_DIR/sitemap.php" > "$TEST_DIR/sitemap.xml"
          python3 - "$TEST_DIR/sitemap.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          urls = [x.text for x in root.iter() if x.tag.endswith('loc')]
          for needed in ['https://rentmor.pl/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php','https://rentmor.pl/poradnik-pranie-tapicerki-karcher-puzzi.php','https://rentmor.pl/poradnik-jaki-papier-scierny-do-zyrafy.php', 'https://rentmor.pl/', 'https://rentmor.pl/zasady.php', 'https://rentmor.pl/szlifierka-betonowa/', 'https://rentmor.pl/odkurzacz-puzzi/']:
              assert needed in urls, (needed, urls)
          print('Sitemap XML and rental terms test passed.')
          PY
          php -r 'require "server/product_description.php"; $html=rentmor_render_description("Parametry:\n- Moc 2200 W\n\n<strong>unsafe</strong>"); if (!str_contains($html, "&lt;strong&gt;unsafe&lt;/strong&gt;") || !str_contains($html, "<ul")) exit(1); echo "Description formatter test passed.\n";'

      - name: Detect isolated public performance update
        id: scope
        run: |
          python3 scripts/public_performance_scope.py >> "$GITHUB_OUTPUT"

      - name: Prepare and validate current public site before upload
        if: steps.config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          mkdir -p "$TEMP_DIR"
          source scripts/secure_sftp_connection.sh

          # Download the ACTUAL live index.php so recent site changes are preserved.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $TEMP_DIR/index.php; bye"
          cp "$TEMP_DIR/index.php" "$TEMP_DIR/original.php"
          # Approved RM artwork; the visible website logo remains untouched.
          cp assets/branding/rm-source.png "$TEMP_DIR/favicon-original.png"
          # Always start with the actual hosting rewrite file, never a repository guess.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/.htaccess -o $TEMP_DIR/.htaccess; bye"
          cp "$TEMP_DIR/.htaccess" "$TEMP_DIR/original.htaccess"
          python3 scripts/patch_canonical_host.py "$TEMP_DIR/.htaccess"
          python3 scripts/patch_private_data_access.py "$TEMP_DIR/.htaccess"
          python3 scripts/patch_image_cache.py "$TEMP_DIR/.htaccess"
          python3 scripts/patch_static_css_cache.py "$TEMP_DIR/.htaccess"
          python3 scripts/patch_catalog_filters.py "$TEMP_DIR/index.php"
          python3 scripts/patch_statistics_filter.py "$TEMP_DIR/index.php"
          python3 scripts/inject_online_tracker.py "$TEMP_DIR/index.php"
          python3 scripts/patch_public_product_layout.py "$TEMP_DIR/index.php"
          python3 scripts/inject_guide_link.py "$TEMP_DIR/index.php"
          python3 scripts/inject_local_seo.py "$TEMP_DIR/index.php"
          python3 scripts/inject_airless_guide_link.py "$TEMP_DIR/index.php"
          python3 scripts/patch_contact_push.py "$TEMP_DIR/index.php"
          python3 scripts/patch_seo_template.py "$TEMP_DIR/index.php"
          python3 scripts/patch_performance_template.py "$TEMP_DIR/index.php"
          python3 scripts/patch_static_cards.py "$TEMP_DIR/index.php"
          php -l "$TEMP_DIR/index.php"

      - name: Compile public Tailwind v3 CSS from live PHP and rendered pages
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/rentmor-prepared"
          npm install --prefix "$RUNNER_TEMP/rentmor-tailwind-tools" --no-save --no-audit --no-fund tailwindcss@3.4.17
          python3 scripts/build_public_tailwind.py \
            "$TEMP_DIR/index.php" "$GITHUB_WORKSPACE" "$TEMP_DIR/css" \
            "$RUNNER_TEMP/rentmor-tailwind-tools/node_modules/.bin/tailwindcss"
          CSS="$(find "$TEMP_DIR/css" -maxdepth 1 -name 'rentmor-tailwind-*.css' -type f -print -quit)"
          test -s "$CSS"
          python3 scripts/patch_static_tailwind.py "$TEMP_DIR/index.php" "/assets/$(basename "$CSS")"
          python3 -m venv "$RUNNER_TEMP/rentmor-favicon-venv"
          "$RUNNER_TEMP/rentmor-favicon-venv/bin/pip" -q install 'Pillow==11.3.0'
          "$RUNNER_TEMP/rentmor-favicon-venv/bin/python" scripts/test_optimize_favicon.py
          "$RUNNER_TEMP/rentmor-favicon-venv/bin/python" scripts/optimize_favicon.py "$TEMP_DIR/favicon-original.png" "$TEMP_DIR/index.php" "$TEMP_DIR/icons"
          python3 scripts/patch_brand_icons.py "$TEMP_DIR/index.php"
          python3 scripts/patch_deferred_fonts.py "$TEMP_DIR/index.php"
          python3 scripts/patch_deferred_fonts.py "$TEMP_DIR/index.php"
          python3 scripts/patch_mobile_rendering.py "$TEMP_DIR/index.php" "$CSS" server/rentmor-gallery.css
          php -l "$TEMP_DIR/index.php"

      - name: Prepare private admin auth as the hosting PHP user
        if: steps.config.outputs.enabled == 'true' && steps.scope.outputs.public_only != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/rentmor-private-admin-auth"
          mkdir -m 700 -p "$DIR"
          source scripts/secure_sftp_connection.sh
          PROBE="rm-admin-auth-$(openssl rand -hex 14).php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d ' ' -f1)"
          cleanup() {
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm public_html/$PROBE; bye" >/dev/null 2>&1 || true
            rm -rf "$DIR"
          }
          trap cleanup EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get public_html/admin.php -o $DIR/live-admin.php; bye"
          cp "$DIR/live-admin.php" "$RUNNER_TEMP/rentmor-prepared/admin-before-auth.php"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; get rentmor-private/admin-security.json -o $DIR/existing.json; bye" >/dev/null 2>&1 || true
          if [ -f "$DIR/existing.json" ] || grep -q '^\$hasz_hasla' "$DIR/live-admin.php"; then
            python3 scripts/bootstrap_admin_auth.py "$DIR/live-admin.php" "$DIR/existing.json" "$DIR/request.json"
          else
            printf '{}\n' > "$DIR/request.json"
          fi
          sed "s/__AUTH_HASH__/$TOKEN_HASH/g" scripts/admin_auth_runtime_installer.php.template > "$DIR/installer.php"
          php -l "$DIR/installer.php"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/installer.php -o public_html/$PROBE; bye"
          RESPONSE="$(curl --fail --silent --show-error --max-time 30 --request POST \
            --header "X-RentMor-Probe: $TOKEN" --header "Content-Type: application/json" \
            --data-binary "@$DIR/request.json" "https://rentmor.pl/$PROBE")"
          printf '%s' "$RESPONSE" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("php_readable") is True'
          echo "Admin auth config migrated/verified by PHP itself, no secrets logged."

      - name: Upload validated RentMor files over SFTP
        if: steps.config.outputs.enabled == 'true' && steps.scope.outputs.public_only != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${LFTP_PASSWORD:?Missing FTP_PASSWORD}"

          # Pass credentials as process arguments, not by interpolating them
          # into lftp's command language. This avoids quote/shell parsing issues.
          source scripts/secure_sftp_connection.sh
          LFTP_COMMAND="$SFTP_CONNECT_SETUP; put server/private_rental_files.php -o public_html/private_rental_files.php; put server/rental_inventory.php -o public_html/rental_inventory.php; put server/admin_safety.php -o public_html/admin_safety.php; put server/admin_auth.php -o public_html/admin_auth.php; put server/phone_events.php -o public_html/phone_events.php; put server/rental_offer_details_extra.php -o public_html/rental_offer_details_extra.php; put server/rental_offer_details.php -o public_html/rental_offer_details.php; put server/related_offers.php -o public_html/related_offers.php; put server/rentmor-gallery.js -o public_html/rentmor-gallery.js; put server/performance_images.php -o public_html/performance_images.php; put server/traffic_filter.php -o public_html/traffic_filter.php; put server/browser_stats.php -o public_html/browser_stats.php; put server/pageview.php -o public_html/pageview.php; put server/notebook_sync.php -o public_html/notebook_sync.php; put server/protocol_sync.php -o public_html/protocol_sync.php; put server/push_bridge.php -o public_html/push_bridge.php; put server/online.php -o public_html/online.php; put server/phone_event.php -o public_html/phone_event.php; put server/phone_events_view.php -o public_html/phone_events_view.php; put server/online.js -o public_html/online.js; put server/product_description.php -o public_html/product_description.php; put server/poradnik-jaki-papier-scierny-do-zyrafy.php -o public_html/poradnik-jaki-papier-scierny-do-zyrafy.php; put server/poradnik-pranie-tapicerki-karcher-puzzi.php -o public_html/poradnik-pranie-tapicerki-karcher-puzzi.php; put server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php -o public_html/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php; put server/sitemap.php -o public_html/sitemap.php; put server/robots.txt -o public_html/robots.txt"
          if [ -f server/admin.php ]; then
            LFTP_COMMAND="$LFTP_COMMAND; put server/admin.php -o public_html/admin.php"
          else
            echo "server/admin.php not present in repository; admin.php upload skipped"
          fi
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$LFTP_COMMAND; bye"
          # Never leave the web admin unavailable after switching to private authentication.
          # If its configuration cannot be read, restore the known-good previous login.
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "https://rentmor.pl/admin.php")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Admin login health check failed: HTTP $STATUS; rolling back admin.php."
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $RUNNER_TEMP/rentmor-prepared/admin-before-auth.php -o public_html/admin.php; bye"
            exit 1
          fi
          echo "Admin entrypoint responds HTTP 200 after private-auth migration."


      - name: Publish versioned public image helper before switching PHP
