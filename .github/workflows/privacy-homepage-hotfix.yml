name: Publish RentMor privacy homepage safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-homepage-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize with the main public site deploy; never race on live index.php.
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false

jobs:
  publish-privacy-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secure SFTP and PHP tools
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${LFTP_PASSWORD:?Missing FTP_PASSWORD}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli
      - name: Validate consent, retention and current live homepage
        run: |
          set -euo pipefail
          python3 scripts/test_legacy_consent_patch.py
          python3 scripts/test_message_retention_patch.py
          python3 scripts/test_privacy_page.py
          php scripts/test_privacy_retention.php
          source scripts/secure_sftp_connection.sh
          DIR="$RUNNER_TEMP/verified-privacy-homepage"
          mkdir -m 700 -p "$DIR"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $DIR/original.php; bye" >/dev/null
          for file in privacy_retention.php cookie-consent.js traffic_filter.php browser_stats.php pageview.php online.php phone_event.php online.js; do
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
              -e "$SFTP_CONNECT_SETUP; get public_html/$file -o $DIR/$file; bye" >/dev/null
            cmp "server/$file" "$DIR/$file"
          done
          cp "$DIR/original.php" "$DIR/index.php"
          python3 scripts/patch_message_retention.py "$DIR/index.php"
          python3 scripts/patch_privacy_link.py "$DIR/index.php"
          python3 scripts/patch_contact_privacy.py "$DIR/index.php"
          python3 scripts/patch_legacy_consent.py "$DIR/index.php"
          php -l "$DIR/index.php"
          cp "$DIR/index.php" "$DIR/first-pass.php"
          python3 scripts/patch_message_retention.py "$DIR/index.php"
          python3 scripts/patch_privacy_link.py "$DIR/index.php"
          python3 scripts/patch_contact_privacy.py "$DIR/index.php"
          python3 scripts/patch_legacy_consent.py "$DIR/index.php"
          cmp "$DIR/index.php" "$DIR/first-pass.php"
          echo "Hosting-owned homepage patched idempotently; all cookie/stat dependencies match main."
      - name: Publish with backup, change detection and automatic rollback
        run: |
          set -euo pipefail
          source scripts/secure_sftp_connection.sh
          DIR="$RUNNER_TEMP/verified-privacy-homepage"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; get public_html/index.php -o $DIR/current.php; bye" >/dev/null
          cmp "$DIR/original.php" "$DIR/current.php"
          if ! cmp -s "$DIR/original.php" "$DIR/index.php"; then
            printf 'Require all denied\n' > "$DIR/backup.htaccess"
            printf '<?php http_response_code(404); exit; ?>\n' > "$DIR/backup.php"
            cat "$DIR/original.php" >> "$DIR/backup.php"
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
              -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/.rentmor-backups; set cmd:fail-exit yes; put $DIR/backup.htaccess -o public_html/.rentmor-backups/.htaccess; put $DIR/backup.php -o public_html/.rentmor-backups/privacy-home-before-$GITHUB_RUN_ID.php; put $DIR/index.php -o public_html/index.php; get public_html/index.php -o $DIR/readback.php; bye" >/dev/null
            cmp "$DIR/index.php" "$DIR/readback.php"
          else
            echo "Homepage already updated."
          fi
          if ! python3 scripts/verify_public_privacy.py; then
            echo "::error::Public privacy smoke test failed; restoring original homepage."
            lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
              -e "$SFTP_CONNECT_SETUP; put $DIR/original.php -o public_html/index.php; get public_html/index.php -o $DIR/rollback.php; bye" >/dev/null
            cmp "$DIR/original.php" "$DIR/rollback.php"
            exit 1
          fi
          echo "PASS: actual public RentMor homepage privacy, consent and retention verified."
