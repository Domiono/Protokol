name: Correct RentMor Control v0.5 capability description
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mcp-v05-info.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rentmor-control-v05-info
  cancel-in-progress: false
jobs:
  fix:
    if: github.repository == 'Domiono/Protokol'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source, correct capabilities text, back up, publish, smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp
          source scripts/secure_sftp_connection.sh
          TMP="$(mktemp -d "$RUNNER_TEMP/rentmor-mcp-info.XXXXXX")"
          LIVE="public_html/rentmor-control-mcp/mcp.php"
          BACKUP="rentmor-control-private/mcp-v05-info-backup-$GITHUB_RUN_ID.php"
          MODIFIED=0
          VERIFIED=0
          cleanup() {
            rc=$?
            if [ "$MODIFIED" = 1 ] && [ "$VERIFIED" != 1 ]; then
              lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TMP/old.php -o $LIVE; get $LIVE -o $TMP/restored.php; bye" >/dev/null 2>&1 || true
              if cmp -s "$TMP/old.php" "$TMP/restored.php"; then echo 'Old MCP restored.'; else echo 'WARNING: check MCP backup'; fi
            fi
            rm -rf "$TMP"
            exit "$rc"
          }
          trap cleanup EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $LIVE -o $TMP/old.php; bye" >/dev/null
          python3 - "$TMP/old.php" "$TMP/new.php" <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text()
          known="const RM_MCP_VERSION = '0.5.0';"
          old="'notes'=>'Publiczne pliki bez logowania. Wybrane pliki PHP dostępne po OAuth. Nigdy nie czyta danych klientów, sekretów ani nie wykonuje zapisu.',"
          new="'notes'=>'Odczyt dozwolonego kodu wymaga OAuth source:read. Zapis wybranych jawnych plików wymaga scope source:write oraz osobnej zgody właściciela hasłem na każdą zmianę. Brak dostępu do danych klientów, sekretów, administratora i kodu OAuth.',"
          assert text.count(known)==1 and text.count(old)==1, 'Unknown MCP source: refuse changes'
          text=text.replace(old,new,1)
          Path(sys.argv[2]).write_text(text)
          print('Verified current MCP v0.5 release and updated only one informational string')
          PY
          php -l "$TMP/new.php"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $LIVE -o $TMP/compare.php; put $TMP/old.php -o $BACKUP; get $BACKUP -o $TMP/back.php; bye" >/dev/null
          cmp "$TMP/old.php" "$TMP/compare.php"
          cmp "$TMP/old.php" "$TMP/back.php"
          MODIFIED=1
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $TMP/new.php -o $LIVE; get $LIVE -o $TMP/readback.php; bye" >/dev/null
          cmp "$TMP/new.php" "$TMP/readback.php"
          curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"rentmor_info","arguments":{}},"id":1}' 'https://rentmor.pl/rentmor-control-mcp/index.php' |
            python3 -c 'import json,sys; j=json.load(sys.stdin)["result"]["structuredContent"]; assert j["version"]=="0.5.0" and "source:write" in j["notes"] and "osobnej zgody" in j["notes"]; print("Live MCP capability description and OAuth protection accurate.")'
          VERIFIED=1
          echo 'SUCCESS: MCP 0.5 capability info corrected; auth and code unchanged.'
