name: Repair Mortii at source and verify mobile production
on:
  push:
    branches: [codex/mortii-visual-20261110]
    paths: [.github/workflows/mortii-visual-repair.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'paramiko==3.5.1' 'playwright==1.56.0'
      - name: Patch only presentation files with pinned versions and verified private backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/mortii-visual/repair/deploy.py
      - name: Real Chromium Android emulation on four production pages
        run: python3 deployment/mortii-visual/repair/browser_check.py --after
      - name: Restore presentation if deployment or mobile checks fail
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/mortii-visual-state.json" ]; then
            python3 deployment/mortii-visual/repair/deploy.py --rollback
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mortii-mobile-after
          path: mortii-browser-proof/
          retention-days: 7
