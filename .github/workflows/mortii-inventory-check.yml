name: Mortii read-only inventory diagnosis
on:
  push:
    branches: [codex/mortii-copy-deployment-preparation]
    paths: [.github/workflows/mortii-inventory-check.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'paramiko==3.5.1'
      - name: Count matching inventory only; no customer reads or writes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,sys,hashlib,base64,json,stat
          sys.path.insert(0,'deployment/mortii-copy')
          from deploy import PINS,read_remote
          import paramiko
          t=paramiko.Transport((os.environ['FTP_SERVER'],22222))
          try:
              t.start_client(timeout=25)
              fp=base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              assert fp in PINS
              t.auth_password(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'],fallback=False)
              s=paramiko.SFTPClient.from_transport(t);s.get_channel().settimeout(30)
              active=[]
              for root in ['rentmor-private/rental-data','public_html/rentmor-private/rental-data']:
                  try:
                      if stat.S_ISREG(s.lstat(root+'/active.flag').st_mode): active.append(root)
                  except FileNotFoundError: pass
              assert len(active)<=1
              path=(active[0] if active else 'public_html')+'/rental_assets.php'
              data,_=read_remote(s,path)
              assets=json.loads(data.split(b'\n',1)[1]);assert isinstance(assets,list)
              name='Szlifierka kątowa 230mm Bosch Professional GWS 2200'
              print('MATCHING_PHYSICAL_COPIES='+str(sum(a.get('equipment')==name for a in assets)))
              print('INVENTORY_READ_ONLY_OK')
          except Exception as e:
              print('DIAGNOSIS_STOPPED_'+type(e).__name__);sys.exit(1)
          finally: t.close()
          PY
