name: Fix RentMor Control OAuth browser redirect CSP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mcp-oauth-csp.yml'
      - 'scripts/patch_mcp_oauth_csp.py'
      - 'scripts/test_mcp_oauth_csp_browser.py'
      - 'scripts/mcp_oauth_csp_probe.php.template'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentmor-control-oauth-csp-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Domiono/Protokol'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP, Chromium test dependencies and secure SFTP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp
          python3 -m venv "$RUNNER_TEMP/rm-playwright"
          "$RUNNER_TEMP/rm-playwright/bin/pip" -q install 'playwright==1.56.0'
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            "$RUNNER_TEMP/rm-playwright/bin/python" -m playwright install --with-deps chromium
          fi
      - name: Reproduce Chromium bug, test fix, back up and deploy only oauth_core.php
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?SFTP server secret missing}"
          : "${FTP_USERNAME:?SFTP user secret missing}"
          : "${LFTP_PASSWORD:?SFTP password secret missing}"
          source scripts/secure_sftp_connection.sh
          umask 077
          DIR="$(mktemp -d "$RUNNER_TEMP/rentmor-csp.XXXXXX")"
          CORE="public_html/rentmor-control-mcp/oauth_core.php"
          BACKUP="rentmor-control-private/oauth-core-backup-before-csp-$GITHUB_RUN_ID.php"
          SWITCH=0
          VERIFIED=0
          cleanup() {
            rc=$?
            if [ "$SWITCH" = 1 ] && [ "$VERIFIED" != 1 ]; then
              echo "::warning::CSP fix not verified. Attempting rollback of only oauth_core.php."
              if lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/original.php -o $CORE; get $CORE -o $DIR/restored.php; bye" >/dev/null &&
                 cmp -s "$DIR/original.php" "$DIR/restored.php"; then
                echo "Original OAuth core restored and verified."
              else
                echo "::error::Rollback not verified; original is backed up privately at $BACKUP."
              fi
            fi
            if [ -n "${PROBE:-}" ]; then
              lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; rm public_html/rentmor-control-mcp/$PROBE; bye" >/dev/null 2>&1 || true
            fi
            rm -rf "$DIR"
            exit "$rc"
          }
          trap cleanup EXIT
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $CORE -o $DIR/original.php; get public_html/rentmor-control-mcp/oauth.php -o $DIR/oauth.php; get public_html/rentmor-control-mcp/change-password.php -o $DIR/change-password.php; bye" >/dev/null
          python3 scripts/patch_mcp_oauth_csp.py "$DIR/original.php" "$DIR/patched.php"
          php -l "$DIR/original.php" >/dev/null
          php -l "$DIR/patched.php" >/dev/null
          php -l "$DIR/oauth.php" >/dev/null
          php -l "$DIR/change-password.php" >/dev/null
          python3 scripts/test_mcp_oauth_retry.py "$DIR/oauth.php" "$DIR/patched.php"
          "$RUNNER_TEMP/rm-playwright/bin/python" scripts/test_mcp_oauth_csp_browser.py "$DIR/original.php" "$DIR/patched.php" "$DIR/oauth.php" "$DIR/change-password.php"
          # Abort if live bytes changed during tests; never patch an unrecognized revision.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; get $CORE -o $DIR/current.php; bye" >/dev/null
          cmp "$DIR/original.php" "$DIR/current.php"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/original.php -o $BACKUP; get $BACKUP -o $DIR/backup-check.php; bye" >/dev/null
          cmp "$DIR/original.php" "$DIR/backup-check.php"
          echo 'Original OAuth core privately backed up and verified.'
          SWITCH=1
          echo 'Uploading only OAuth core; rollback is armed.'
          if ! lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/patched.php -o $CORE; get $CORE -o $DIR/readback.php; bye" >/dev/null; then
            echo "::error::OAuth core SFTP upload or readback failed."
            exit 1
          fi
          if ! cmp -s "$DIR/patched.php" "$DIR/readback.php"; then
            echo "::error::OAuth core bytes after upload differ from tested candidate."
            exit 1
          fi
          echo 'SFTP upload and readback verified.'
          # AZ.pl may reject intentionally incomplete OAuth URLs as HTTP 403.
          # Inspect the real PHP CSP decision with a short-lived, secret-gated probe.
          PROBE="rm-csp-$(openssl rand -hex 16).php"
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          sed "s/__TOKEN_HASH__/$TOKEN_HASH/g" scripts/mcp_oauth_csp_probe.php.template > "$DIR/probe.php"
          php -l "$DIR/probe.php" >/dev/null
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" -e "$SFTP_CONNECT_SETUP; put $DIR/probe.php -o public_html/rentmor-control-mcp/$PROBE; bye" >/dev/null
          probe_code="$(curl -sS --max-time 30 --request POST --header "X-Rentmor-Csp-Diag: $TOKEN" -D "$DIR/auth-headers.txt" -o "$DIR/probe-response.txt" -w '%{http_code}' "https://rentmor.pl/rentmor-control-mcp/$PROBE")"
          echo "Protected CSP diagnostic: HTTP $probe_code (expect 200)"
          test "$probe_code" = 200
          curl --fail --silent --show-error --max-time 30 -D "$DIR/change-headers.txt" -o /dev/null 'https://rentmor.pl/rentmor-control-mcp/change-password.php'
          echo 'Public password-change page: HTTP 200.'
          curl --fail --silent --show-error --max-time 30 'https://rentmor.pl/rentmor-control-mcp/oauth.php?op=metadata' |
            python3 -c 'import json,sys; j=json.load(sys.stdin); assert j.get("issuer")=="https://rentmor.pl/rentmor-control-mcp"; print("OAuth metadata verified")'
          python3 - "$DIR/auth-headers.txt" "$DIR/change-headers.txt" <<'PY'
          from pathlib import Path
          import sys
          def policy(path):
              headers=Path(path).read_text().splitlines()
              policies=[h.split(':',1)[1].strip() for h in headers if h.lower().startswith('content-security-policy:')]
              assert len(policies)==1, 'Unexpected number of CSP policies'
              return policies[0]
          approval=policy(sys.argv[1]); password=policy(sys.argv[2])
          assert "form-action 'self' https://chatgpt.com;" in approval, 'OAuth approval callback not allowed'
          assert "form-action 'self';" in password and 'https://chatgpt.com' not in password, 'Password-change CSP weakened'
          assert "frame-ancestors 'none'" in approval and "default-src 'none'" in approval, 'Other CSP controls changed'
          print('Production OAuth approval CSP allows only self and chatgpt.com.')
          print('Production owner password-change CSP remains same-origin.')
          PY
          VERIFIED=1
          echo 'SUCCESS: browser OAuth CSP fix published; only oauth_core.php changed.'
