name: Final Mortii mobile proof and private progress save
on:
  push:
    branches: [codex/mortii-visual-20261110]
    paths: [.github/workflows/mortii-visual-final-check.yml]
permissions:
  contents: read
concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'paramiko==3.5.1' 'playwright==1.56.0'
      - name: Verify images, mobile click/close and actual greeting avatars
        run: python3 deployment/mortii-visual/repair/browser_check.py --after
      - name: Save exact repository progress documents to private server directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/progress-sync/sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mortii-final-mobile-proof
          path: mortii-browser-proof/
          retention-days: 7
