name: Authorized AI knowledge deployment
on:
  push:
    branches: [codex/admin-ai-knowledge-20261110]
    paths: [.github/workflows/knowledge-deploy.yml]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-knowledge-signed-apk
          path: signed
          run-id: 42825160844
          github-token: ${{ github.token }}
      - run: python3 -m pip install 'paramiko==3.5.1' --quiet
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Recheck synthetic knowledge tests
        run: php scripts/test_ai_app_knowledge.php
      - name: Publish exact source versions and same-signer APK
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deployment/ai-knowledge/deploy.py
