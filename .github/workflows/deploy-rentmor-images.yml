name: Optimize RentMor product photos
on:
  workflow_run:
    workflows: ['Deploy RentMor galleries']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'

concurrency:
  group: rentmor-public-homepage
  cancel-in-progress: false

jobs:
  optimize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image optimizer and PHP output
        run: |
          set -euo pipefail
          php -l server/performance_images.php
          python3 scripts/test_performance_images.py

      - name: Verify encrypted SFTP configuration
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::SFTP secrets unavailable; image optimization cannot be deployed."
            exit 1
          fi

      - name: Install offline WebP converter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          python3 -m venv "$RUNNER_TEMP/rentmor-image-venv"
          "$RUNNER_TEMP/rentmor-image-venv/bin/pip" -q install 'Pillow==11.3.0'
          "$RUNNER_TEMP/rentmor-image-venv/bin/python" scripts/test_performance_images.py

      - name: Read latest product image references and previous manifest
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/rentmor-photos"
          mkdir -p "$DIR/originals" "$DIR/webp"
          chmod 700 "$DIR"
          source scripts/secure_sftp_connection.sh
          # A first deployment has no previous manifest: missing is expected.
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; get public_html/data.json -o $DIR/data.json; bye"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; get public_html/rentmor-image-manifest.json -o $DIR/previous.json; bye" || true
          python3 scripts/prepare_rentmor_images.py plan "$DIR/data.json" "$DIR/previous.json" "$DIR/originals" "$DIR/download.lftp"
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; source $DIR/download.lftp; bye" || true
          # Unavailable individual images are skipped by the converter; it refuses an empty manifest.

      - name: Compress to content-hashed responsive WebP sizes
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/rentmor-photos"
          "$RUNNER_TEMP/rentmor-image-venv/bin/python" scripts/prepare_rentmor_images.py convert \
            "$DIR/data.json" "$DIR/previous.json" "$DIR/originals" "$DIR/webp" "$DIR/manifest.json" "$DIR/upload.lftp"
          python3 -m json.tool "$DIR/manifest.json" >/dev/null

      - name: Upload only derivatives and versioned manifest, never original images
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/rentmor-photos"
          source scripts/secure_sftp_connection.sh
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22222" \
            -e "$SFTP_CONNECT_SETUP; set cmd:fail-exit no; mkdir -p public_html/uploads/rentmor-webp; mkdir -p public_html/assets; set cmd:fail-exit yes; source $DIR/upload.lftp; put $DIR/manifest.json -o public_html/rentmor-image-manifest.json; get public_html/rentmor-image-manifest.json -o $DIR/verified.json; bye"
          cmp "$DIR/manifest.json" "$DIR/verified.json"
          python3 scripts/verify_rentmor_webp.py "$DIR/manifest.json"
