name: Verify Public RentMor Pages
on:
  workflow_run:
    workflows: ['Deploy RentMor API', 'Deploy RentMor galleries']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check public SEO and offer pages
        run: python3 scripts/verify_public_seo.py
