name: Test rental operations
on:
  push:
    branches: ['feature/rental-operations']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: php -l server/protocol_sync.php
      - run: php -l server/admin.php
      - run: php scripts/test_admin_rental_stats.php
      - run: php scripts/test_rental_rules.php
      - run: python3 scripts/test_rental_api.py
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rentmor-operations-debug
          path: app/build/outputs/apk/debug/app-debug.apk
