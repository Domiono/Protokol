name: Test rental operations
on:
  push:
    branches: ['feature/rental-operations']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: php -l server/protocol_sync.php
      - run: php -l server/admin.php
      - run: php scripts/test_admin_rental_stats.php
      - run: php scripts/test_rental_rules.php
      - run: python3 scripts/test_rental_api.py
      - run: python3 scripts/test_inject_local_seo.py
      - run: python3 scripts/test_inject_airless_guide_link.py
      - run: php -l server/poradnik-agregat-malarski-jak-malowac-dobor-dysz.php
      - run: python3 scripts/test_public_seo.py
      - run: php -l server/poradnik-pranie-tapicerki-karcher-puzzi.php
      - run: php -l server/sitemap.php
      - name: Diagnose live API response format without device credentials
        continue-on-error: true
        run: python3 scripts/diagnose_live_sync_http.py
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rentmor-operations-debug
          path: app/build/outputs/apk/debug/app-debug.apk
